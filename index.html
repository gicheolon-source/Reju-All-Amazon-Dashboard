<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMZ Ads Lab — Dr. Reju-All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181D; --ink2:#3A3D45; --muted:#8A867C;
  --paper:#F5F4F0; --card:#FFFFFF; --line:#E5E2DA; --line2:#D8D4C9;
  --accent:#E8850C; --accent-soft:#FDF1E1;
  --good:#1B8A5A; --good-soft:#E4F3EC;
  --bad:#D64545; --bad-soft:#FBE9E9;
  --warn:#B7791F; --warn-soft:#FBF3DF;
  --info:#3A6EA5; --info-soft:#E8EFF7;
  --navy:#171C26;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13px}
.topbar{background:var(--navy);color:#EDEBE4;position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1360px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand .amz-dot{color:var(--accent);font-weight:700}
.brand span{font-size:11px;color:#9A96A8;font-family:var(--mono)}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{padding:6px 13px;border-radius:6px;font-size:13px;font-weight:500;color:#B9B6AC;text-decoration:none;white-space:nowrap}
nav a.on{background:rgba(232,133,12,.16);color:#FFC978}
nav a:hover{color:#fff}
.topbar-right{margin-left:auto}
.data-pill{font-family:var(--mono);font-size:11px;color:#9A96A8;background:rgba(255,255,255,.06);padding:4px 10px;border-radius:20px;white-space:nowrap}
.data-pill b{color:#FFC978}
/* ── 주차 캘린더 선택기 ── */
.cal-wrap{position:relative}
.cal-btn{background:rgba(255,255,255,.08);color:#EDEBE4;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--mono);white-space:nowrap;display:flex;align-items:center;gap:7px}
.cal-btn:hover{background:rgba(255,255,255,.15)}
.cal-btn .cal-n{color:#FFC978;font-weight:600}
.cal-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:306px;padding:12px;
  background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.2);
  user-select:none;-webkit-user-select:none}   /* 클릭이 글자 선택으로 번지지 않게 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:13px}
.cal-nav{width:26px;height:26px;line-height:1;font-size:15px;color:var(--ink2);background:none;border:1px solid var(--line2);border-radius:6px}
.cal-nav:hover:not(:disabled){background:var(--paper)}
.cal-nav:disabled{opacity:.28}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow span{text-align:center;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-row{display:grid;grid-template-columns:repeat(7,1fr);border-radius:6px;position:relative;cursor:pointer}
.cal-row .d{text-align:center;font-size:12px;font-family:var(--mono);padding:5px 0}
.cal-row .d.out{color:var(--line2)}
.cal-row.off{cursor:default;opacity:.3}
.cal-row:not(.off):hover{background:var(--accent-soft)}
.cal-row.sel{background:var(--accent);color:#fff}
.cal-row.sel .d.out{color:rgba(255,255,255,.5)}
.cal-row.anchor{outline:2px dashed var(--accent);outline-offset:-2px}
.cal-mode{display:flex;gap:0;margin-bottom:8px;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.cal-mode button{flex:1;padding:5px 0;font-size:11.5px;font-weight:600;background:var(--card);color:var(--ink2);border:0}
.cal-mode button.on{background:var(--accent);color:#fff}
.cal-row .ev{position:absolute;right:3px;top:0;font-size:9px;font-style:normal;color:var(--accent)}
.cal-row.sel .ev{color:#FFE7C2}
.cal-foot{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.75}
.cal-foot b{color:var(--ink);font-family:var(--mono)}
.wrap{max-width:1360px;margin:0 auto;padding:24px 20px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.page-head p{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:14px;font-weight:600}
.card-head .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.card-body{padding:18px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .k-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.kpi .k-val{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px;letter-spacing:-.5px}
.kpi .k-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.k-val.good{color:var(--good)} .k-val.bad{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#FBFAF7;text-align:right;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th.l,td.l{text-align:left}
th:hover{color:var(--ink)}
th .arr{color:var(--accent);font-family:var(--mono)}
td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.l{font-family:'IBM Plex Sans KR';font-size:13px}
tr:hover td{background:#FBFAF6}
.num-good{color:var(--good);font-weight:600}
.num-bad{color:var(--bad);font-weight:600}
.term{font-weight:500}
/* 긴 검색어·타겟·캠페인명이 열 폭을 밀어내 지표를 화면 밖으로 내보내므로 잘라낸다.
   전문은 title 로 남기고, CSV 내보내기는 원문 그대로 나간다. */
.trunc{display:inline-block;max-width:36ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.trunc.sm{max-width:28ch}
@media (max-width:900px){.trunc{max-width:22ch}.trunc.sm{max-width:18ch}}
.dim{color:var(--muted);font-size:11px}
a.asin{color:var(--info);text-decoration:none;border-bottom:1px dotted var(--info)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'IBM Plex Sans KR';line-height:1.6}
.chip.scale{background:var(--good-soft);color:var(--good)}
.chip.neg{background:var(--bad-soft);color:var(--bad)}
.chip.harvest{background:var(--info-soft);color:var(--info)}
.chip.watch{background:#F0EEE8;color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.mt{background:#F0EEE8;color:var(--ink2);padding:1px 7px;border-radius:4px;font-size:10.5px;font-family:var(--mono)}
.mt.pt{background:#E3EBF4;color:#31597F}
.mt.auto{background:#EEE7F6;color:#6B4E9B}
.prod{padding:1px 7px;border-radius:4px;font-size:10.5px;font-family:var(--mono);font-weight:600}
.prod.SP{background:#E4F3EC;color:#1B8A5A}.prod.SB{background:#E8EFF7;color:#3A6EA5}.prod.SD{background:#FBF3DF;color:#B7791F}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.inp{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:#fff;min-width:0}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pf-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;border-top:3px solid var(--pfc,var(--accent))}
.pf-card h3{font-size:15px;font-weight:700}
.pf-card .pf-meta{font-size:11.5px;color:var(--muted);margin:2px 0 12px;font-family:var(--mono)}
.pf-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:12px}
.pf-nums div b{display:block;font-family:var(--mono);font-size:15px;font-weight:600}
.pf-nums div span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.bar-duo{height:8px;border-radius:4px;background:#EFEDE6;overflow:hidden;display:flex;margin:4px 0 2px}
.bar-duo i{display:block;height:100%}
.acos-line{display:flex;justify-content:space-between;font-size:11px;font-family:var(--mono);color:var(--muted)}
.pf-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:34px;text-align:center;color:var(--muted);background:#FCFBF8;transition:.15s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink)}
.drop input{display:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.share-bar{display:inline-flex;width:110px;height:8px;border-radius:4px;background:#EFEDE6;overflow:hidden;vertical-align:middle}
.share-bar i{height:100%;background:var(--accent)}
.src-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.src-line:last-child{border-bottom:0}
.src-line .st-ok{color:var(--good);font-weight:600}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <div class="brand"><b>AMZ<span class="amz-dot">·</span>ADS LAB</b><span id="brandSub">Dr. Reju-All</span></div>
  <nav id="nav">
    <a href="#/overview" data-r="overview">개요</a>
    <a href="#/portfolio" data-r="portfolio">포트폴리오</a>
    <a href="#/campaigns" data-r="campaigns">캠페인</a>
    <a href="#/products" data-r="products">제품별</a>
    <a href="#/terms" data-r="terms">서치텀</a>
    <a href="#/targeting" data-r="targeting">타겟팅</a>
    <a href="#/data" data-r="data">데이터·설정</a>
  </nav>
  <div class="topbar-right" style="display:flex;align-items:center;gap:10px">
    <div class="cal-wrap">
      <button id="calBtn" class="cal-btn" onclick="toggleCal(event)">기간 선택 ▾</button>
      <div id="calPop" class="cal-pop" hidden></div>
    </div>
    <div class="data-pill" id="dataPill"></div></div>
</div></div>

<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════ State ═══════════════════ */
const LS_KEY='amzAdsLab.v4.rejuall';
let D={st:[],tg:[],cp:[],ap:[],period:'',account:'',prev:null,combo:null,isEvent:false,notes:[]};
let META={account:'',weeks:[]};   // /api/weeks 응답
let S={ pfCfg:{}, asinNames:{},
        settings:{targetAcos:30, negClicks:10, negSpend:10, harvestOrders:3, currency:'$'},
        topF:{waste:'', win:'clk10'},   // 개요 낭비/효율 TOP 최소 기준
        /* 실제 데이터에 등장한 표기로 초기값을 잡았다. 데이터·설정 탭에서 편집한다.
           경쟁사가 먼저 매칭되므로 rejuran 은 자사 패턴 'dr reju' 보다 우선한다. */
        brands:{ own:['rejuall','reju all','reju-all','dr reju','rejuval'],
                 comp:['rejuran','anua','celimax','medicube','illiyoon','biodance','centellian','sheglam','anasol'] },
        sel:{from:'',to:''} };    // 캘린더에서 고른 주차 범위
const PALETTE=['#E8850C','#3A6EA5','#1B8A5A','#8A5CB8','#D64545','#4A7B8C','#B7791F','#5B8A3C','#A0527D','#556B8A','#7A6A4F'];
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
function load(){ try{const d=localStorage.getItem(LS_KEY); if(d){const p=JSON.parse(d); S={...S,...p, settings:{...S.settings,...(p.settings||{})}, topF:{...S.topF,...(p.topF||{})}, brands:{own:p.brands?.own??S.brands.own, comp:p.brands?.comp??S.brands.comp}, pfCfg:{...(p.pfCfg||{})}, asinNames:p.asinNames||{}};}}catch(e){} }
const fmt=(n,d=0)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>S.settings.currency+fmt(n,2);
const money0=n=>S.settings.currency+fmt(n,0);
const pct=(n,d=1)=>n==null||!isFinite(n)?'–':fmt(n,d)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
/* ══════ 검색어 유형 분류 ══════
   자사 브랜드 표기가 매우 다양하다 (rejuall / reju all / reju-all / dr. reju-all / dr reju).
   공백·점·하이픈을 지우고 비교해야 한 규칙으로 잡힌다.
   순서가 중요하다: 경쟁사를 먼저 본다 — 'rejuran'(PDRN 경쟁사)이 자사 패턴 'dr reju' 에
   걸려 자사로 오분류되는 것을 막는다. */
const KINDS={ own:{label:'자사 브랜드',c:'#1B8A5A'}, comp:{label:'경쟁사 브랜드',c:'#D64545'},
              gen:{label:'일반 키워드',c:'#3A6EA5'}, asin:{label:'ASIN 타겟',c:'#8A5CB8'} };
const KIND_ORDER=['own','comp','gen','asin'];
const normB=s=>String(s??'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
/* 같은 검색어가 캠페인마다 반복되므로 결과를 캐시한다 (수만 행 × 패턴 수를 피한다) */
let _kindCache=new Map();
const clearKindCache=()=>_kindCache=new Map();
function termKind(t){
  if(_kindCache.has(t))return _kindCache.get(t);
  let k;
  if(asinOf(t)) k='asin';
  else{
    const n=normB(t);
    const hit=list=>(list||[]).some(x=>{const v=normB(x);return v&&n.includes(v);});
    k = !n ? 'gen' : hit(S.brands?.comp) ? 'comp' : hit(S.brands?.own) ? 'own' : 'gen';
  }
  _kindCache.set(t,k);
  return k;
}
/* 유형별로 행을 한 번만 나눈다 */
function splitKind(rows){
  const m={};
  for(const r of rows){ if(!r.term)continue; const k=termKind(r.term); (m[k]??=[]).push(r); }
  return m;
}
const kindChip=k=>`<span class="chip" style="background:${KINDS[k].c}1A;color:${KINDS[k].c}">${KINDS[k].label}</span>`;

const ASIN_RE=/^b0[a-z0-9]{8}$/i;
const asinOf=s=>{const m=String(s).match(/asin\s*=\s*"?([A-Za-z0-9]{10})"?/i);return m?m[1].toUpperCase():(ASIN_RE.test(String(s).trim())?String(s).trim().toUpperCase():null);};
const asinLink=a=>`<a class="asin" href="https://www.amazon.com/dp/${a}" target="_blank" rel="noopener">${a}</a>`;

/* ═══════════════ Data source (/api) ═══════════════ */
async function api(path){
  const r=await fetch(path,{headers:{accept:'application/json'}});
  if(r.status===401){ location.href='/login'; throw new Error('로그인이 필요합니다'); }
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.error||`${path} → HTTP ${r.status}`);
  return j;
}
/* 서버가 보내는 사전 압축 포맷을 화면이 쓰는 객체로 되돌린다 */
function expand(E){
  const P=E.pfs,C=E.camps,G=E.ags;
  return {
    st:E.st.map(r=>({pf:P[r[0]],camp:C[r[1]],ag:G[r[2]],term:r[3],imp:r[4],clk:r[5],cost:r[6],pur:r[7],sales:r[8],units:r[9],ntbSales:r[10],dpv:r[11]})),
    tg:E.tg.map(r=>({pf:P[r[0]],camp:C[r[1]],ag:G[r[2]],tgt:r[3],mt:r[4],bid:r[5],status:String(r[6]||'').toUpperCase().slice(0,1),imp:r[7],clk:r[8],cost:r[9],pur:r[10],sales:r[11],units:r[12],_sd:r[13]})),
    cp:E.cp.map(r=>({pf:P[r[0]],camp:C[r[1]],prod:r[2],imp:r[3],clk:r[4],cost:r[5],pur:r[6],sales:r[7],ntbPur:r[8],ntbSales:r[9],dpv:r[10]})),
    ap:E.ap.map(r=>({pf:P[r[0]],camp:C[r[1]],asin:r[2],title:r[3],imp:r[4],clk:r[5],cost:r[6],pur:r[7],sales:r[8],units:r[9]})),
    period:E.period, isEvent:!!E.isEvent, notes:E.notes||[], weeks:E.weeks,
  };
}
const _cache=new Map();
function fetchWindow(weeks){
  const k=weeks.join(',');
  if(!_cache.has(k)) _cache.set(k, api('/api/data?weeks='+encodeURIComponent(k)).then(expand).catch(e=>{_cache.delete(k);throw e;}));
  return _cache.get(k);
}

/* ══════════ 기간 선택 — 캘린더에서 주차를 고른다 ══════════
   SEL 은 연속된 주차 범위(from~to). 여러 주를 고르면 서버가 합산해서 돌려준다.
   비교 기준(D.prev)은 같은 길이의 직전 창이다. */
let SEL={from:'',to:''};
let calMonth='', calOpen=false;
let calMode='one';      // 'one' = 클릭한 주만, 'range' = 시작→끝 두 번 클릭
let calAnchor=null;     // range 모드에서 먼저 클릭한 시작 주

const DAY=86400000;
const tOf=d=>Date.parse(d+'T00:00:00Z');
const ymd=t=>new Date(t).toISOString().slice(0,10);
const sundayOf=t=>t-new Date(t).getUTCDay()*DAY;

const weekIds=()=>META.weeks.map(w=>w.id);
const weekById=id=>META.weeks.find(w=>w.id===id);

/* 선택 범위에 실제로 데이터가 있는 주차만 (사이에 빈 주가 있으면 자연히 제외된다) */
function selWeeks(){
  const ids=weekIds(), a=ids.indexOf(SEL.from), b=ids.indexOf(SEL.to);
  if(a<0||b<0)return [];
  return ids.slice(Math.min(a,b), Math.max(a,b)+1);
}
function prevWeeks(){
  const ids=weekIds(), cur=selWeeks();
  if(!cur.length)return [];
  const i=ids.indexOf(cur[0]), n=cur.length;
  return i-n>=0 ? ids.slice(i-n, i) : [];
}
function selLabel(){
  const w=selWeeks();
  if(!w.length)return '';
  const a=weekById(w[0]).label, b=weekById(w[w.length-1]).label;
  return w.length===1 ? a : a.split(' – ')[0]+' – '+b.split(' – ')[1];
}
const cmpAuto=()=>D.prev;

/* 표시 중인 달에 걸치는 주(일요일 시작) 목록 */
function calRows(month){
  const first=tOf(month+'-01');
  const d=new Date(first);
  const last=Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0);
  const out=[];
  for(let t=sundayOf(first); t<=last; t+=7*DAY) out.push(t);
  return out;
}
function renderCal(){
  const pop=document.getElementById('calPop');
  const ids=weekIds();
  if(!ids.length)return;
  const minM=ids[0].slice(0,7), maxM=ids[ids.length-1].slice(0,7);
  if(!calMonth)calMonth=(SEL.to||ids[ids.length-1]).slice(0,7);
  if(calMonth<minM)calMonth=minM;
  if(calMonth>maxM)calMonth=maxM;
  const [Y,M]=calMonth.split('-').map(Number);
  const sel=new Set(selWeeks());

  const rows=calRows(calMonth).map(t=>{
    const ws=ymd(t), w=weekById(ws);
    const cells=Array.from({length:7},(_,i)=>{
      const d=new Date(t+i*DAY);
      return `<span class="d${d.getUTCMonth()+1!==M?' out':''}">${d.getUTCDate()}</span>`;
    }).join('');
    const tip=w ? `${w.label} · 서치텀 ${fmt(w.counts.st)}행 · 캠페인 ${fmt(w.counts.cp)}행` : '적재된 데이터 없음';
    return `<div class="cal-row${w?'':' off'}${sel.has(ws)?' sel':''}${calAnchor===ws?' anchor':''}" title="${esc(tip)}"`
      + (w?` onclick="pickWeek('${ws}')"`:'') + `>${cells}${w&&w.isEvent?'<i class="ev">★</i>':''}</div>`;
  }).join('');

  const guide = calMode==='range'
    ? (calAnchor
        ? `시작 <b>${esc(weekById(calAnchor).label.split(' – ')[0])}</b> — 이제 <b>끝 주</b>를 클릭하세요`
        : `<b>시작 주</b>를 클릭한 뒤 <b>끝 주</b>를 클릭하세요`)
    : `주를 클릭하면 그 주만 봅니다`;

  pop.innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" onclick="calNav(-1)" ${calMonth<=minM?'disabled':''}>‹</button>
      <b>${Y}년 ${M}월</b>
      <button class="cal-nav" onclick="calNav(1)" ${calMonth>=maxM?'disabled':''}>›</button>
    </div>
    <div class="cal-mode">
      <button class="${calMode==='one'?'on':''}" onclick="setCalMode('one')">한 주</button>
      <button class="${calMode==='range'?'on':''}" onclick="setCalMode('range')">범위 합산</button>
    </div>
    <div class="cal-dow">${['일','월','화','수','목','금','토'].map(d=>`<span>${d}</span>`).join('')}</div>
    ${rows}
    <div class="cal-foot">
      선택 <b>${esc(selLabel())||'—'}</b>${sel.size>1?` · ${sel.size}주 합산`:''}<br>
      ${guide} · <span style="color:var(--accent)">★</span> 행사주
    </div>`;
}
function setCalMode(m){ calMode=m; calAnchor=null; renderCal(); }
function calNav(d){
  const [Y,M]=calMonth.split('-').map(Number);
  calMonth=ymd(Date.UTC(Y, M-1+d, 1)).slice(0,7);
  renderCal();
}
function pickWeek(ws){
  if(calMode==='one'){ SEL={from:ws,to:ws}; calAnchor=null; }
  else if(!calAnchor){ calAnchor=ws; SEL={from:ws,to:ws}; }   // 시작 주 — 우선 그 주만 보여준다
  else { SEL={from:calAnchor,to:ws}; calAnchor=null; }        // 끝 주 — 범위 확정
  renderCal();
  return applySel();
}
function toggleCal(ev){
  ev?.stopPropagation();
  calOpen=!calOpen;
  document.getElementById('calPop').hidden=!calOpen;
  calAnchor=null;                                     // 열 때마다 범위 선택은 처음부터
  if(calOpen){ calMonth=(SEL.to||weekIds().slice(-1)[0]||'').slice(0,7); renderCal(); }
}
/* click 이 아니라 mousedown 으로 판정한다 — renderCal() 이 팝업 내부를 다시 그리면
   클릭된 요소가 DOM 에서 떨어져 나가고, click 이 document 까지 올라올 때는
   closest('.cal-wrap') 가 null 이 되어 내부 클릭이 외부로 오판된다. */
document.addEventListener('mousedown',e=>{
  if(!calOpen || e.target.closest('.cal-wrap'))return;
  calOpen=false;
  document.getElementById('calPop').hidden=true;
});

function busy(){ const p=document.getElementById('dataPill'); if(p)p.textContent='불러오는 중…'; }
function fail(e){
  view.innerHTML=`<div class="card"><div class="card-head"><h2>데이터를 불러올 수 없습니다</h2></div><div class="card-body">
    <div class="hint" style="color:var(--bad)">${esc(e.message)}</div>
    <div class="hint" style="margin-top:12px">시트를 갱신한 뒤 <b>npm run update</b> 를 실행하면 DB가 최신화됩니다.</div></div></div>`;
}
/* 클릭을 연달아 하면 먼저 보낸 요청이 늦게 도착해 최신 선택을 덮어쓸 수 있다.
   순번을 매겨 마지막 선택의 응답만 반영한다. */
let selSeq=0;
async function applySel(){
  const weeks=selWeeks();
  if(!weeks.length)return;
  const my=++selSeq;
  S.sel={...SEL}; save(); busy();
  try{
    const prev=prevWeeks();
    const [cur,prv]=await Promise.all([fetchWindow(weeks), prev.length?fetchWindow(prev):null]);
    if(my!==selSeq)return;                       // 더 최근 선택이 진행 중이면 버린다
    D.st=cur.st; D.tg=cur.tg; D.cp=cur.cp; D.ap=cur.ap;
    D.period=selLabel()+(weeks.length>1?` · ${weeks.length}주 합산`:'');
    D.isEvent=cur.isEvent; D.notes=cur.notes; D.weeks=weeks;
    D.prev=prv?{id:'__prev',label:prv.period,st:prv.st,tg:prv.tg,cp:prv.cp,ap:prv.ap}:null;
    cmpData=null;
    pfNames().forEach(n=>{ if(!S.pfCfg[n])S.pfCfg[n]={targetAcos:S.settings.targetAcos}; });
    save();
  }catch(e){ if(my===selSeq)fail(e); return; }
  route();
}
/* 한 주만 보기 — 데이터·설정 탭의 '이 주차 보기' 등에서 쓴다 */
function setActive(id){
  SEL={from:id,to:id}; calAnchor=null;
  if(calOpen)renderCal();
  return applySel();
}
async function boot(){
  try{
    META=await api('/api/weeks');
    D.account=META.account;
    document.getElementById('brandSub').textContent=META.account;
    if(!META.weeks.length){
      view.innerHTML=`<div class="card"><div class="card-head"><h2>데이터가 없습니다</h2></div><div class="card-body">
        <div class="hint">DB에 적재된 주차가 없습니다. 시트를 채운 뒤 <b>npm run update</b> 를 실행해주세요.</div></div></div>`;
      return;
    }
    /* 저장된 선택이 지금 DB에도 있으면 복원, 없으면 서치텀이 있는 가장 최근 주차로
       시작한다 — 캠페인만 있는 주차는 상단 KPI 가 비어 보인다 */
    const s=S.sel;
    if(s?.from && weekById(s.from) && weekById(s.to)) SEL={from:s.from,to:s.to};
    else {
      const w=META.weeks.filter(x=>x.counts.st>0).slice(-1)[0] ?? META.weeks[META.weeks.length-1];
      SEL={from:w.id,to:w.id};
    }
    await applySel();
  }catch(e){ fail(e); }
}
function pfNames(){
  const set=new Set();
  D.st.forEach(r=>set.add(r.pf)); D.tg.forEach(r=>set.add(r.pf)); D.cp.forEach(r=>set.add(r.pf));
  set.delete('');
  /* 정렬은 캠페인 지출(총액) 기준 — 화면의 금액 순서와 일치해야 한다 */
  const cost={}; D.cp.forEach(r=>cost[r.pf]=(cost[r.pf]||0)+r.cost);
  return [...set].sort((a,b)=>(cost[b]||0)-(cost[a]||0));
}
const pfColor=n=>PALETTE[Math.max(0,pfNames().indexOf(n))%PALETTE.length];
const pfAcos=n=>S.pfCfg[n]?.targetAcos||S.settings.targetAcos;

/* ═══════════════ Aggregation & verdicts ═══════════════ */
function agg(rows){
  const a={imp:0,clk:0,cost:0,pur:0,sales:0,units:0,ntbSales:0,dpv:0};
  for(const r of rows){a.imp+=r.imp;a.clk+=r.clk;a.cost+=r.cost;a.pur+=r.pur;a.sales+=r.sales;a.units+=r.units||0;a.ntbSales+=r.ntbSales||0;a.dpv+=r.dpv||0;}
  a.ctr=a.imp?a.clk/a.imp*100:null;
  a.cpc=a.clk?a.cost/a.clk:null;
  a.cvr=a.clk?a.pur/a.clk*100:null;
  a.acos=a.sales?a.cost/a.sales*100:(a.cost>0?Infinity:null);
  a.roas=a.cost?a.sales/a.cost:null;
  a.ntbShare=a.sales?a.ntbSales/a.sales*100:null;
  return a;
}
function groupBy(rows,keyFn){
  const m=new Map();
  for(const r of rows){const k=keyFn(r); if(!m.has(k))m.set(k,[]); m.get(k).push(r);}
  return m;
}
function verdict(a,target){
  const st=S.settings;
  if(a.pur===0 && (a.clk>=st.negClicks || a.cost>=st.negSpend)) return {k:'neg',label:'제외 후보'};
  if(a.pur>=st.harvestOrders && a.acos!=null && a.acos<=target) return {k:'harvest',label:'수확·이관'};
  if(a.pur>=2 && a.acos!=null && a.acos<=target*0.8) return {k:'scale',label:'스케일업'};
  if(a.pur>0 && a.acos!=null && a.acos>target*1.3) return {k:'warn',label:'입찰 인하'};
  return {k:'watch',label:'관찰'};
}
const acosCell=(a,target)=>`<td class="${a.acos!=null&&a.acos!==Infinity&&a.acos<=target?'num-good':(a.pur===0&&a.cost>0)||(a.acos!=null&&a.acos!==Infinity&&a.acos>target*1.3)?'num-bad':''}">${a.acos==null?'–':a.acos===Infinity?'∞':pct(a.acos)}</td>`;
/* 개요 낭비/효율 TOP 의 최소 기준 필터.
   효율 TOP 은 클릭 1~2회짜리가 ACOS 0.3% 로 1등을 차지해 재현 불가능한
   우연이 상단을 덮으므로 기본값을 클릭 10회 이상으로 둔다. */
const TOP_FILTERS=[
  { k:'',       label:'전체' },
  { k:'clk10',  label:'클릭 10회 이상' },
  { k:'clk20',  label:'클릭 20회 이상' },
  { k:'clk50',  label:'클릭 50회 이상' },
  { k:'cost10', label:'지출 $10 이상' },
  { k:'cost20', label:'지출 $20 이상' },
  { k:'cost50', label:'지출 $50 이상' },
];
function topPass(a,k){
  const m=/^(clk|cost)(\d+)$/.exec(k||'');
  if(!m)return true;
  return m[1]==='clk' ? a.clk>=+m[2] : a.cost>=+m[2];
}
const topSel=(which,cur)=>`<select class="inp" style="font-size:11px;padding:3px 5px" onchange="setTopFilter('${which}',this.value)">`
  +TOP_FILTERS.map(f=>`<option value="${f.k}" ${cur===f.k?'selected':''}>${f.label}</option>`).join('')+`</select>`;
function setTopFilter(which,k){ S.topF={...S.topF,[which]:k}; save(); renderOverview(); }

const CLK_OPTS=[0,5,10,20,50];
const clkSelect=(cur,fn)=>`<select class="inp" onchange="${fn}(parseInt(this.value))" title="최소 클릭 필터">${CLK_OPTS.map(v=>`<option value="${v}" ${cur===v?'selected':''}>${v===0?'클릭 전체':'클릭 ≥ '+v}</option>`).join('')}</select>`;

  const p=document.getElementById('dataPill');

    +(D.isEvent?' · <b style="color:var(--accent)">행사주</b>':'');

function pfSelector(current,fn){
  return `<select class="inp" onchange="${fn}(this.value)"><option value="">전체 포트폴리오</option>`+
    pfNames().map(n=>`<option value="${esc(n)}" ${current===n?'selected':''}>${esc(n)}</option>`).join('')+`</select>`;

const byPf=(rows,pf)=>pf?rows.filter(r=>r.pf===pf):rows;
function qParam(){ const q=location.hash.split('?')[1]; return q?new URLSearchParams(q):null; }

/* ═══════════════ Overview ═══════════════ */
let ovPf='', ovCmp='auto', cmpData=null;
function setOvPf(v){ovPf=v;renderOverview();}
async function setOvCmp(v){
  ovCmp=v; cmpData=null;
  const w=(v!=='auto'&&v!=='none')?weekById(v):null;
  if(w){ try{ const d=await fetchWindow([w.id]); cmpData={id:w.id,label:d.period,st:d.st,tg:d.tg,cp:d.cp,ap:d.ap}; }
         catch(e){ toast('비교 기간을 불러올 수 없습니다: '+e.message); } }
  renderOverview();
}
function deltaHtml(cur,prev,inverse){
  if(prev==null||!isFinite(prev)||prev===0||cur==null||!isFinite(cur))return '';
  const d=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(d)<0.05)return '<span class="dim">— 0%</span>';
  const up=d>0, good=inverse?!up:up;
  return `<span style="color:${good?'var(--good)':'var(--bad)'}">${up?'▲':'▼'} ${fmt(Math.abs(d),1)}%</span>`;
}
function acosDelta(cur,prev){
  if(prev==null||!isFinite(prev)||cur==null||!isFinite(cur))return '';
  const d=cur-prev;
  if(Math.abs(d)<0.05)return '<span class="dim">— 0pp</span>';
  return `<span style="color:${d<0?'var(--good)':'var(--bad)'}">${d>0?'▲':'▼'} ${fmt(Math.abs(d),1)}pp</span>`;
}
/* 상단 KPI 는 서치텀 리포트 기준인데 캠페인 리포트만 있는 주차가 섞이면
   같은 화면 안에서 지출이 몇 배씩 어긋난다. 그 불일치를 숨기지 않고 알린다. */
function stCoverage(){
  const ids=D.weeks||[];
  if(!ids.length||!D.cp.length)return '';
  const have=ids.filter(id=>(META.weeks.find(w=>w.id===id)?.counts.st||0)>0);
  if(have.length===ids.length)return '';
  const box=b=>`<div class="card" style="border-color:var(--warn);background:var(--warn-soft)"><div class="card-body">${b}
    <div class="hint" style="margin-top:6px">해당 주차 서치텀 리포트를 <b>reports/</b> 에 넣고 <b>npm run load</b> 를 실행하면 채워집니다.</div></div></div>`;
  const missing=ids.length-have.length;
  if(!have.length) return box(`<b>이 기간에는 서치텀 리포트가 없습니다 — 검색어 단위 분석만 비어 있습니다</b>
    <div class="hint" style="margin-top:6px">상단 KPI와 캠페인·포트폴리오 탭은 캠페인 리포트 기준이라 정상입니다.
    비는 것은 <b>서치텀 판정 요약 · 지출 낭비/효율 TOP · 서치텀 탭</b>입니다.</div>`);
  const lbl=have.map(id=>esc(String(META.weeks.find(w=>w.id===id).label).split(' – ')[0])).join(', ');
  return box(`<b>검색어 단위 분석은 이 기간 ${ids.length}주 중 ${have.length}주만 반영합니다</b>
    <div class="hint" style="margin-top:6px">서치텀 리포트가 있는 주차는 <b>${lbl}</b> 뿐입니다 (${missing}주 누락).
    상단 KPI는 캠페인 기준이라 ${ids.length}주 전체가 반영되니, 아래 검색어 표와 기간이 다릅니다.</div>`);
}
function renderOverview(){
  const st=byPf(D.st,ovPf), cp=byPf(D.cp,ovPf);
  /* 상단 KPI 는 캠페인 리포트 기준이다 — 그게 광고비·매출의 진짜 총액이다.
     서치텀 리포트는 SB/SD 일부가 빠져 총액의 80~87% 밖에 담지 못하므로
     검색어 단위 분석(판정 요약·낭비/효율 TOP)에만 쓴다. */
  const a=agg(cp), aSt=agg(st);
  const target=ovPf?pfAcos(ovPf):S.settings.targetAcos;
  const acosCls=a.acos==null?'':(a.acos<=target?'good':'bad');
  // comparison
  let cmpSnap=ovCmp==='auto'?cmpAuto():(ovCmp!=='none'?cmpData:null);
  if(cmpSnap&&cmpSnap.id&&selWeeks().includes(cmpSnap.id))cmpSnap=null;
  const b=cmpSnap?agg(byPf(cmpSnap.cp||[],ovPf)):null;
  const sub=(cur,prev,inv)=>b?`<div class="k-sub">${deltaHtml(cur,prev,inv)} <span class="dim">vs ${esc(cmpSnap.label.split('–')[0].trim())}~</span></div>`:'';
  const terms=[...groupBy(st.filter(r=>r.term),r=>r.term).values()].map(rs=>{const ag=agg(rs);return {a:ag,v:verdict(ag,target)};});
  const vc={neg:0,scale:0,harvest:0,warn:0,watch:0}; terms.forEach(x=>vc[x.v.k]++);
  const negCost=terms.filter(x=>x.v.k==='neg').reduce((s,x)=>s+x.a.cost,0);
  const prodSum=[...groupBy(cp,r=>r.prod).entries()].map(([p,rs])=>({p,a:agg(rs)})).sort((x,y)=>y.a.cost-x.a.cost);
  const prodTot=prodSum.reduce((s,x)=>s+x.a.cost,0)||1;
  const pfRows=pfNames().map(n=>({n,a:agg(D.cp.filter(r=>r.pf===n))})).filter(x=>x.a.cost>0||x.a.sales>0);
  const pfTot=pfRows.reduce((s,x)=>s+x.a.cost,0)||1;
  const tlist=[...groupBy(st.filter(r=>r.term),r=>r.term).entries()].map(([t,rs])=>({t,a:agg(rs)}));
  /* 검색어 유형별 — 자사 방어 / 경쟁사 공략 / 일반 확보 / ASIN 타겟의 효율을 분리해 본다.
     전체 평균 ACOS 에 묻히는 구조를 드러내는 게 목적이다. */
  const kindRows=splitKind(st);
  const kindSum=KIND_ORDER.filter(k=>kindRows[k]).map(k=>({k,a:agg(kindRows[k]),n:new Set(kindRows[k].map(r=>r.term)).size}))
    .filter(x=>x.a.cost>0||x.a.sales>0);
  const kindTot=kindSum.reduce((s,x)=>s+x.a.cost,0)||1;

      <div class="kpi"><div class="k-label">ROAS</div><div class="k-val">${a.roas==null?'–':fmt(a.roas,2)}</div>${sub(a.roas,b?.roas,false)}</div>
      <div class="kpi"><div class="k-label">구매</div><div class="k-val">${fmt(a.pur)}</div>${b?sub(a.pur,b.pur,false):`<div class="k-sub">CVR ${pct(a.cvr)}</div>`}</div>
      <div class="kpi"><div class="k-label">클릭</div><div class="k-val">${fmt(a.clk)}</div>${b?sub(a.clk,b.clk,false):`<div class="k-sub">CTR ${pct(a.ctr,2)} · CPC ${money(a.cpc||0)}</div>`}</div>
    </div>
    <div class="grid2">
      <div class="card" style="margin:0"><div class="card-head"><h2>광고 유형별 성과<span class="sub">캠페인 리포트</span></h2></div>
        <div class="tbl-wrap"><table><thead><tr><th class="l">유형</th><th>지출</th><th>매출</th><th>구매</th><th>ACOS</th><th>지출 비중</th></tr></thead><tbody>
        ${prodSum.map(x=>`<tr><td class="l"><span class="prod ${x.p}">${x.p}</span></td><td>${money(x.a.cost)}</td><td>${money(x.a.sales)}</td><td>${fmt(x.a.pur)}</td>${acosCell(x.a,target)}<td><span class="share-bar"><i style="width:${x.a.cost/prodTot*100}%"></i></span> <span class="dim">${pct(x.a.cost/prodTot*100,0)}</span></td></tr>`).join('')||'<tr><td colspan=6 class="l dim">캠페인 리포트 없음 — 데이터·설정에서 업로드</td></tr>'}

      <div class="card" style="margin:0"><div class="card-head"><h2>서치텀 판정 요약<span class="sub">검색어 ${fmt(tlist.length)}개${a.cost?` · 지출 커버리지 ${pct(aSt.cost/a.cost*100,0)}`:''}</span></h2><a href="#/terms" class="btn sm" style="text-decoration:none">전체 보기 →</a></div>
        <div class="card-body">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">

            <span class="chip scale">스케일업 ${vc.scale}</span><span class="chip warn">입찰 인하 ${vc.warn}</span>
            <span class="chip watch">관찰 ${vc.watch}</span></div>
          <div class="hint">주문 없이 소진된 지출(제외 후보 합계): <b style="color:var(--bad)">${money(negCost)}</b> — 전체 지출의 ${pct(negCost/(a.cost||1)*100)}</div>

      <div class="tbl-wrap"><table><thead><tr><th class="l">포트폴리오</th><th>지출</th><th>매출</th><th>구매</th><th>CVR</th><th>ACOS</th><th>목표</th><th>지출 비중</th></tr></thead><tbody>
      ${pfRows.map(x=>`<tr><td class="l"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${pfColor(x.n)};margin-right:7px"></span><b>${esc(x.n)}</b></td>

        <td><span class="share-bar"><i style="width:${x.a.cost/pfTot*100}%;background:${pfColor(x.n)}"></i></span> <span class="dim">${pct(x.a.cost/pfTot*100,0)}</span></td></tr>`).join('')}
      </tbody></table></div></div>`:''}
    ${kindSum.length>1?`<div class="card" style="margin-top:16px"><div class="card-head">
      <h2>검색어 유형별 성과<span class="sub">서치텀 기준 · 자사 방어 vs 경쟁사 공략 vs 일반 확보</span></h2>
      <a href="#/data" class="btn sm" style="text-decoration:none">브랜드 키워드 설정 →</a></div>
      <div class="tbl-wrap"><table><thead><tr><th class="l">유형</th><th>검색어</th><th>클릭</th><th>지출</th><th>구매</th><th>매출</th><th>ACOS</th><th>ROAS</th><th>지출 비중</th></tr></thead><tbody>
      ${kindSum.map(x=>`<tr>
        <td class="l">${kindChip(x.k)}</td>
        <td>${fmt(x.n)}</td><td>${fmt(x.a.clk)}</td><td>${money(x.a.cost)}</td>
        <td>${fmt(x.a.pur)}</td><td>${money(x.a.sales)}</td>
        ${acosCell(x.a,target)}
        <td>${x.a.roas==null?'–':fmt(x.a.roas,2)}</td>
        <td><span class="share-bar"><i style="width:${x.a.cost/kindTot*100}%;background:${KINDS[x.k].c}"></i></span> <span class="dim">${pct(x.a.cost/kindTot*100,0)}</span></td></tr>`).join('')}
      </tbody></table></div></div>`:''}
    <div class="grid2" style="margin-top:16px">
      <div class="card" style="margin:0"><div class="card-head"><h2>지출 낭비 TOP<span class="sub">구매 0건 · 조건 충족 ${fmt(wastePass.length)}/${fmt(wasteAll.length)}</span></h2>${topSel('waste',fW)}</div>

        <tbody>${waste.map(x=>li(x,true)).join('')||`<tr><td colspan=6 class="l dim">없음${fW?' — 기준을 낮춰보세요 (전체 '+fmt(wasteAll.length)+'개)':''}</td></tr>`}</tbody></table></div></div>
      <div class="card" style="margin:0"><div class="card-head"><h2>효율 TOP<span class="sub">매출 $50↑ · 낮은 ACOS · 조건 충족 ${fmt(winPass.length)}/${fmt(winAll.length)}</span></h2>${topSel('win',fWin)}</div>
        <div class="tbl-wrap"><table><thead><tr><th class="l">검색어</th><th>클릭</th><th>지출</th><th>구매</th><th>매출</th><th>ACOS</th></tr></thead>
        <tbody>${winners.map(x=>li(x,false)).join('')||`<tr><td colspan=6 class="l dim">없음${fWin?' — 기준을 낮춰보세요 (전체 '+fmt(winAll.length)+'개)':''}</td></tr>`}</tbody></table></div></div>
    </div>`;
}

/* ═══════════════ Portfolio ═══════════════ */
function renderPortfolio(){
  const cards=pfNames().map(n=>{
    /* 캠페인 리포트 기준 — 개요 KPI 와 같은 총액이어야 한다.
       단 NTB 매출은 캠페인 리포트에 비어 있어 서치텀 기준으로 따로 계산한다. */
    const rows=D.cp.filter(r=>r.pf===n);
    const a=agg(rows), aSt=agg(D.st.filter(r=>r.pf===n));
    const camps=new Set(rows.map(r=>r.camp)).size;
    const target=pfAcos(n);
    const over=a.acos!=null&&a.acos!==Infinity&&a.acos>target;
    const tot=a.cost+a.sales||1;
    const c=pfColor(n);
    return `<div class="pf-card" style="--pfc:${c}">
      <h3>${esc(n)}</h3>
      <div class="pf-meta" title="NTB 비중은 서치텀 리포트 기준 — 캠페인 리포트에는 NTB 매출이 비어 있습니다">캠페인 ${camps}개 · NTB ${pct(aSt.ntbShare,0)}</div>
      <div class="pf-nums">
        <div><span>지출</span><b>${money0(a.cost)}</b></div>
        <div><span>매출</span><b>${money0(a.sales)}</b></div>
        <div><span>구매</span><b>${fmt(a.pur)}</b></div>
        <div><span>ROAS</span><b>${a.roas==null?'–':fmt(a.roas,2)}</b></div>
      </div>
      <div class="bar-duo"><i style="width:${a.cost/tot*100}%;background:${c}"></i><i style="width:${a.sales/tot*100}%;background:${c}55"></i></div>
      <div class="acos-line"><span>ACOS <b class="${over?'num-bad':'num-good'}">${a.acos==null?'–':a.acos===Infinity?'∞':pct(a.acos)}</b> / 목표 ${pct(target,0)}</span><span>${over?'목표 초과 ▲':'목표 이내'}</span></div>
      <div class="pf-actions">
        <button class="btn sm" onclick="editPfTarget('${esc(n)}')">목표 ACOS ✎</button>
        <button class="btn sm" onclick="location.hash='#/terms?pf='+encodeURIComponent('${esc(n)}')">서치텀</button>
        <button class="btn sm" onclick="location.hash='#/targeting?pf='+encodeURIComponent('${esc(n)}')">타겟팅</button>
        <button class="btn sm" onclick="location.hash='#/campaigns?pf='+encodeURIComponent('${esc(n)}')">캠페인</button>
      </div></div>`;
  }).join('');
  view.innerHTML=`
    <div class="page-head"><div><h1>포트폴리오</h1><p>아마존 광고 콘솔의 포트폴리오를 자동 인식했습니다. 카드에서 제품별 목표 ACOS를 설정하세요. <span class="dim">· 캠페인 리포트(총액) 기준</span></p></div></div>
    <div class="pf-grid">${cards}</div>`;
}
function editPfTarget(n){
  const cur=pfAcos(n);
  const v=prompt(`"${n}" 목표 ACOS (%)`,cur);
  if(v==null)return;
  const num=parseFloat(v);
  if(isNaN(num)||num<=0){toast('숫자를 입력해주세요');return;}
  S.pfCfg[n]={...(S.pfCfg[n]||{}),targetAcos:num};
  save();route();toast(`${n} 목표 ACOS → ${num}%`);
}

/* ═══════════════ Campaigns ═══════════════ */
let cState={pf:'',prod:'',q:'',sort:'cost',dir:-1};
function setCPf(v){cState.pf=v;renderCampaigns();}
function setCProd(v){cState.prod=v;renderCampaigns();}
function setCSort(k){ if(cState.sort===k)cState.dir*=-1; else{cState.sort=k;cState.dir=-1;} renderCampaigns(); }
function renderCampaigns(){
  const qp=qParam(); if(qp&&qp.get('pf')){cState.pf=qp.get('pf');history.replaceState(null,'','#/campaigns');}
  let list=[...groupBy(byPf(D.cp,cState.pf),r=>r.camp+'│'+r.prod).values()].map(rs=>({camp:rs[0].camp,pf:rs[0].pf,prod:rs[0].prod,a:agg(rs)}));
  if(cState.prod)list=list.filter(x=>x.prod===cState.prod);
  if(cState.q){const q=cState.q.toLowerCase();list=list.filter(x=>x.camp.toLowerCase().includes(q));}
  list.sort((x,y)=>{let a=x.a[cState.sort]??x[cState.sort],b=y.a[cState.sort]??y[cState.sort];
    if(a==null||a===Infinity)a=cState.sort==='acos'?9e9:-1;if(b==null||b===Infinity)b=cState.sort==='acos'?9e9:-1;
    return (a<b?-1:a>b?1:0)*cState.dir;});
  const A=agg(byPf(D.cp,cState.pf).filter(x=>!cState.prod||x.prod===cState.prod));
  const th=(k,l)=>`<th onclick="setCSort('${k}')">${l}${cState.sort===k?`<span class="arr">${cState.dir<0?' ▼':' ▲'}</span>`:''}</th>`;
  view.innerHTML=`
    <div class="page-head"><div><h1>캠페인</h1><p>캠페인 리포트 기준 · SP/SB/SD 통합</p></div>
      <div class="toolbar"><button class="btn" onclick="exportCampaigns()">CSV 내보내기</button></div></div>
    <div class="card"><div class="filters">
      ${pfSelector(cState.pf,'setCPf')}
      <span class="seg">
        <button class="${!cState.prod?'on':''}" onclick="setCProd('')">전체</button>
        <button class="${cState.prod==='SP'?'on':''}" onclick="setCProd('SP')">SP</button>
        <button class="${cState.prod==='SB'?'on':''}" onclick="setCProd('SB')">SB</button>
        <button class="${cState.prod==='SD'?'on':''}" onclick="setCProd('SD')">SD</button></span>
      <input class="inp" placeholder="캠페인 검색" value="${esc(cState.q)}" oninput="cState.q=this.value;clearTimeout(window.__cq);window.__cq=setTimeout(renderCampaigns,250)" style="width:200px">
      <span class="dim" style="margin-left:auto">${fmt(list.length)}개 · 지출 ${money(A.cost)} · ACOS ${A.acos===Infinity?'∞':pct(A.acos)}</span></div>
    <div class="tbl-wrap" style="max-height:680px;overflow-y:auto"><table><thead><tr>
      <th class="l" onclick="setCSort('camp')">캠페인${cState.sort==='camp'?`<span class="arr">${cState.dir<0?' ▼':' ▲'}</span>`:''}</th><th class="l">유형</th>
      ${th('imp','노출')}${th('clk','클릭')}${th('ctr','CTR')}${th('cost','지출')}${th('cpc','CPC')}${th('pur','구매')}${th('cvr','CVR')}${th('sales','매출')}${th('acos','ACOS')}
    </tr></thead><tbody>
    ${list.map(x=>`<tr>
      <td class="l"><span class="term trunc" title="${esc(x.camp)}">${esc(x.camp)}</span><br><span class="dim trunc sm" title="${esc(x.pf)}">${esc(x.pf)}</span></td>
      <td class="l"><span class="prod ${x.prod}">${x.prod}</span></td>
      <td>${fmt(x.a.imp)}</td><td>${fmt(x.a.clk)}</td><td>${pct(x.a.ctr,2)}</td>
      <td>${money(x.a.cost)}</td><td>${x.a.cpc==null?'–':money(x.a.cpc)}</td>
      <td>${fmt(x.a.pur)}</td><td>${pct(x.a.cvr)}</td><td>${money(x.a.sales)}</td>
      ${acosCell(x.a,pfAcos(x.pf))}
    </tr>`).join('')||'<tr><td colspan=12 class="l dim">이 기간에 캠페인 리포트가 없습니다 — 시트에 해당 주차 리포트를 append 한 뒤 npm run update 를 실행해주세요</td></tr>'}
    </tbody></table></div></div>`;
}


/* ═══════════════ Products (광고 제품별) ═══════════════ */
let pState={pf:'',q:'',sort:'cost',dir:-1};
function setPPf(v){pState.pf=v;renderProducts();}
function setPSort(k){ if(pState.sort===k)pState.dir*=-1; else{pState.sort=k;pState.dir=-1;} renderProducts(); }
function prodName(asin,title){ return S.asinNames[asin]||title||''; }
function editAsinName(asin){
  const v=prompt(`${asin} 제품명 (대시보드 표시용)`,S.asinNames[asin]||'');
  if(v==null)return;
  if(v.trim())S.asinNames[asin]=v.trim(); else delete S.asinNames[asin];
  save();renderProducts();
}
function renderProducts(){
  const qp=qParam(); if(qp&&qp.get('pf')){pState.pf=qp.get('pf');history.replaceState(null,'','#/products');}
  if(!D.ap.length){
    view.innerHTML=`
      <div class="page-head"><div><h1>제품별 분석</h1><p>한 캠페인에 여러 제품이 섞여 있어도 광고된 ASIN 단위로 분리해 보여줍니다.</p></div></div>
      <div class="card"><div class="card-body" style="text-align:center;padding:48px 24px">
        <b style="font-size:15px">이 기간에 광고 제품 리포트가 없습니다</b>
        <p class="hint" style="max-width:560px;margin:12px auto 0;text-align:left">
        광고 콘솔 → <b>측정 및 보고 → 리포트 → 리포트 생성</b>에서<br>
        · 캠페인 유형: <b>Sponsored Products</b><br>
        · 리포트 유형: <b>광고 제품 (Advertised product)</b><br>
        을 선택해 다운로드한 뒤, <b>데이터·설정</b> 탭에 올려주세요. 기간·종류는 자동 인식됩니다.<br><br>
        이 리포트에는 행마다 광고된 ASIN이 들어 있어서, Bundle_SP_Auto처럼 여러 제품이 섞인 캠페인도 제품별로 완전히 분리됩니다.
        단, SB(브랜드 광고)는 아마존이 지출을 제품별로 제공하지 않아 이 탭은 SP 캠페인 기준입니다.</p>
        <div style="margin-top:18px"><a href="#/data" class="btn primary" style="text-decoration:none">데이터·설정으로 이동</a></div>
      </div></div>`;
    return;
  }
  const rows=byPf(D.ap,pState.pf);
  const target=pState.pf?pfAcos(pState.pf):S.settings.targetAcos;
  let list=[...groupBy(rows,r=>r.asin).entries()].map(([asin,rs])=>{
    const a=agg(rs);
    const title=rs.find(r=>r.title)?.title||'';
    return {asin,title,name:prodName(asin,title),campaigns:[...new Set(rs.map(r=>r.camp))],pfs:[...new Set(rs.map(r=>r.pf))],a,v:verdict(a,target)};
  });
  if(pState.q){const q=pState.q.toLowerCase();list=list.filter(x=>x.asin.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)||x.campaigns.some(cm=>cm.toLowerCase().includes(q)));}
  list.sort((x,y)=>{let a=x.a[pState.sort],b=y.a[pState.sort];

/* ═══════════════ Search terms ═══════════════ */
let tState={pf:'',q:'',verdict:'',type:'',kind:'',minClk:0,sort:'cost',dir:-1};
function setTKind(v){tState.kind=v;renderTerms();}
function setTPf(v){tState.pf=v;renderTerms();}
function setTVerdict(v){tState.verdict=v;renderTerms();}
function setTType(v){tState.type=v;renderTerms();}
function setTClk(v){tState.minClk=v;renderTerms();}
function setTSort(k){ if(tState.sort===k)tState.dir*=-1; else{tState.sort=k;tState.dir=-1;} renderTerms(); }
function termData(){
  const rows=byPf(D.st,tState.pf);
  const target=tState.pf?pfAcos(tState.pf):S.settings.targetAcos;
  let list=[...groupBy(rows.filter(r=>r.term),r=>r.term).entries()].map(([t,rs])=>{
    const a=agg(rs);
    return {term:t, asin:asinOf(t), campaigns:[...new Set(rs.map(r=>r.camp))], ags:[...new Set(rs.map(r=>r.ag))], a, v:verdict(a,target)};
  });
  if(tState.minClk)list=list.filter(x=>x.a.clk>=tState.minClk);
  if(tState.q){const q=tState.q.toLowerCase();list=list.filter(x=>x.term.toLowerCase().includes(q)||x.campaigns.some(c=>c.toLowerCase().includes(q)));}
  if(tState.verdict)list=list.filter(x=>x.v.k===tState.verdict);
  if(tState.type==='asin')list=list.filter(x=>x.asin);
  if(tState.type==='kw')list=list.filter(x=>!x.asin);
  if(tState.kind)list=list.filter(x=>termKind(x.term)===tState.kind);
  list.sort((x,y)=>{
    let a=tState.sort==='term'?x.term:x.a[tState.sort], b=tState.sort==='term'?y.term:y.a[tState.sort];
    if(a==null||a===Infinity)a=tState.sort==='acos'?9e9:-1; if(b==null||b===Infinity)b=tState.sort==='acos'?9e9:-1;
    return (a<b?-1:a>b?1:0)*tState.dir;
  });
  return list;
}

  view.innerHTML=`
    <div class="page-head"><div><h1>서치텀 분석</h1><p>검색어 단위 집계 (캠페인 통합) · 롱테일 노이즈는 최소 클릭 필터로 제거</p></div>

        <button class="${!tState.type?'on':''}" onclick="setTType('')">전체</button>
        <button class="${tState.type==='kw'?'on':''}" onclick="setTType('kw')">키워드</button>
        <button class="${tState.type==='asin'?'on':''}" onclick="setTType('asin')">ASIN 매치</button></span>
      <select class="inp" onchange="setTKind(this.value)">
        <option value="">전체 유형</option>
        ${KIND_ORDER.map(k=>`<option value="${k}" ${tState.kind===k?'selected':''}>${KINDS[k].label}</option>`).join('')}
      </select>
      <input class="inp" placeholder="검색어/캠페인 검색" value="${esc(tState.q)}" oninput="tState.q=this.value;clearTimeout(window.__tq);window.__tq=setTimeout(renderTerms,250)" style="width:180px">
      <select class="inp" onchange="setTVerdict(this.value)">
        <option value="">전체 판정</option>
        <option value="neg" ${tState.verdict==='neg'?'selected':''}>제외 후보</option>
        <option value="harvest" ${tState.verdict==='harvest'?'selected':''}>수확·이관</option>
        <option value="scale" ${tState.verdict==='scale'?'selected':''}>스케일업</option>
        <option value="warn" ${tState.verdict==='warn'?'selected':''}>입찰 인하</option>
        <option value="watch" ${tState.verdict==='watch'?'selected':''}>관찰</option></select>
      <span class="dim" style="margin-left:auto">${fmt(list.length)}개 · 클릭 ${fmt(sumClk)} · 지출 ${money(sumCost)}</span></div>
    <div class="tbl-wrap" style="max-height:680px;overflow-y:auto"><table><thead><tr>
      ${th('term','검색어',1)}<th class="l">판정</th>
      ${th('imp','노출')}${th('clk','클릭')}${th('ctr','CTR')}${th('cost','지출')}${th('cpc','CPC')}${th('pur','구매')}${th('cvr','CVR')}${th('sales','매출')}${th('acos','ACOS')}${th('dpv','DPV')}
    </tr></thead><tbody>
    ${list.slice(0,500).map(x=>`<tr>
      <td class="l">${x.asin?asinLink(x.asin):`<span class="term trunc" title="${esc(x.term)}">${esc(x.term)}</span>`}<br><span class="dim trunc sm" title="${esc(x.campaigns.join(' | '))}">${esc(x.campaigns[0])}${x.campaigns.length>1?` 외 ${x.campaigns.length-1}`:''}</span></td>

      <td>${money(x.a.cost)}</td><td>${x.a.cpc==null?'–':money(x.a.cpc)}</td>
      <td>${fmt(x.a.pur)}</td><td>${pct(x.a.cvr)}</td><td>${money(x.a.sales)}</td>
      ${acosCell(x.a,tState.pf?pfAcos(tState.pf):S.settings.targetAcos)}<td>${fmt(x.a.dpv)}</td>
    </tr>`).join('')}
    </tbody></table>${list.length>500?'<div style="padding:14px;text-align:center" class="dim">상위 500개만 표시 중 — 필터를 좁혀보세요</div>':''}</div></div>`;

/* ═══════════════ Targeting ═══════════════ */
let gState={pf:'',seg:'',q:'',minClk:0,sort:'cost',dir:-1};
function setGPf(v){gState.pf=v;renderTargeting();}
function setGSeg(v){gState.seg=v;renderTargeting();}
function setGClk(v){gState.minClk=v;renderTargeting();}
function setGSort(k){ if(gState.sort===k)gState.dir*=-1; else{gState.sort=k;gState.dir=-1;} renderTargeting(); }
function segOf(r){ if(asinOf(r.tgt))return 'pt'; if(r.mt==='AUTO'||r.mt==='THEME'||r.mt==='PT')return 'auto'; return 'kw'; }
function renderTargeting(){
  const qp=qParam(); if(qp&&qp.get('pf')){gState.pf=qp.get('pf');history.replaceState(null,'','#/targeting');}
  const rows=byPf(D.tg,gState.pf);
  const target=gState.pf?pfAcos(gState.pf):S.settings.targetAcos;
  const segSum={pt:agg(rows.filter(r=>segOf(r)==='pt')),kw:agg(rows.filter(r=>segOf(r)==='kw')),auto:agg(rows.filter(r=>segOf(r)==='auto'))};
  const segTot=segSum.pt.cost+segSum.kw.cost+segSum.auto.cost||1;
  let list=rows.filter(r=>!gState.seg||segOf(r)===gState.seg);
  if(gState.q){const q=gState.q.toLowerCase();list=list.filter(r=>r.tgt.toLowerCase().includes(q)||r.camp.toLowerCase().includes(q));}
  let grp=[...groupBy(list,r=>(asinOf(r.tgt)||r.tgt)+'│'+r.mt).entries()].map(([k,rs])=>{
    const a=agg(rs);
    const maxSd=Math.max(...rs.map(r=>r._sd||0));
    const latest=rs.filter(r=>(r._sd||0)===maxSd);
    const bids=latest.map(r=>r.bid).filter(b=>b>0);
    return {tgt:rs[0].tgt, asin:asinOf(rs[0].tgt), mt:rs[0].mt,
      campaigns:[...new Set(rs.map(r=>r.camp))],
      bidMin:bids.length?Math.min(...bids):null, bidMax:bids.length?Math.max(...bids):null,
      enabled:latest.filter(r=>r.status==='E').length, total:latest.length, a, v:verdict(a,target)};
  });
  if(gState.minClk)grp=grp.filter(x=>x.a.clk>=gState.minClk);
  grp.sort((x,y)=>{let a=x.a[gState.sort],b=y.a[gState.sort];
    if(a==null||a===Infinity)a=gState.sort==='acos'?9e9:-1;if(b==null||b===Infinity)b=gState.sort==='acos'?9e9:-1;
    return (a<b?-1:a>b?1:0)*gState.dir;});
  const mtBadge=m=>`<span class="mt ${m==='PT'?'pt':m==='AUTO'||m==='THEME'?'auto':''}">${esc(m)}</span>`;
  const th=(k,l)=>`<th onclick="setGSort('${k}')">${l}${gState.sort===k?`<span class="arr">${gState.dir<0?' ▼':' ▲'}</span>`:''}</th>`;
  const segCard=(key,name,desc)=>{const s=segSum[key];return `<div class="kpi" style="cursor:pointer;${gState.seg===key?'outline:2px solid var(--accent)':''}" onclick="setGSeg(gState.seg==='${key}'?'':'${key}')">
    <div class="k-label">${name}</div><div class="k-val">${money0(s.cost)}</div>
    <div class="k-sub">매출 ${money0(s.sales)} · ACOS ${s.acos==null?'–':s.acos===Infinity?'∞':pct(s.acos)} · 비중 ${pct(s.cost/segTot*100,0)}</div>
    <div class="k-sub dim">${desc}</div></div>`;};
  view.innerHTML=`
    <div class="page-head"><div><h1>타겟팅 분석</h1><p>경쟁사 ASIN 타겟팅(PT) vs 키워드 vs 오토·테마 — 카드를 눌러 필터링</p></div>
      <div class="toolbar"><button class="btn" onclick="exportTargets()">CSV 내보내기</button>${pfSelector(gState.pf,'setGPf')}</div></div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      ${segCard('pt','제품 타겟팅 (경쟁사 ASIN)','asin= 타겟 · 경쟁 제품 상세페이지 노출')}
      ${segCard('kw','키워드 타겟팅','EXACT / PHRASE / BROAD')}
      ${segCard('auto','오토 · 테마','close-match 등 자동 매칭 + THEME')}
    </div>
    <div class="card"><div class="filters">
      ${clkSelect(gState.minClk,'setGClk')}
      <input class="inp" placeholder="타겟/캠페인 검색" value="${esc(gState.q)}" oninput="gState.q=this.value;clearTimeout(window.__gq);window.__gq=setTimeout(renderTargeting,250)" style="width:220px">
      <span class="dim" style="margin-left:auto">${fmt(grp.length)}개 타겟</span></div>
    <div class="tbl-wrap" style="max-height:660px;overflow-y:auto"><table><thead><tr>
      <th class="l">타겟</th><th class="l">매치</th><th class="l">판정</th><th>입찰가</th><th>상태</th>
      ${th('imp','노출')}${th('clk','클릭')}${th('cost','지출')}${th('cpc','CPC')}${th('pur','구매')}${th('sales','매출')}${th('acos','ACOS')}
    </tr></thead><tbody>
    ${grp.slice(0,500).map(x=>`<tr>
      <td class="l">${x.asin?asinLink(x.asin):`<span class="term trunc" title="${esc(x.tgt)}">${esc(x.tgt)}</span>`}<br><span class="dim trunc sm" title="${esc(x.campaigns.join(' | '))}">${esc(x.campaigns[0])}${x.campaigns.length>1?` 외 ${x.campaigns.length-1}`:''}</span></td>
      <td class="l">${mtBadge(x.mt)}</td>
      <td class="l"><span class="chip ${x.v.k}">${x.v.label}</span></td>
      <td>${x.bidMin==null?'–':x.bidMin===x.bidMax?money(x.bidMin):money(x.bidMin)+'~'+money(x.bidMax)}</td>
      <td class="dim">${x.enabled}/${x.total} ON</td>
      <td>${fmt(x.a.imp)}</td><td>${fmt(x.a.clk)}</td><td>${money(x.a.cost)}</td>
      <td>${x.a.cpc==null?'–':money(x.a.cpc)}</td><td>${fmt(x.a.pur)}</td><td>${money(x.a.sales)}</td>
      ${acosCell(x.a,target)}
    </tr>`).join('')||'<tr><td colspan=12 class="l dim">이 기간에 타겟팅 리포트가 없습니다 — 시트에 해당 주차 리포트를 append 한 뒤 npm run update 를 실행해주세요</td></tr>'}
    </tbody></table>${grp.length>500?'<div style="padding:14px;text-align:center" class="dim">상위 500개만 표시 중</div>':''}</div></div>`;
}

    <div class="card"><div class="card-head"><h2>브랜드 키워드<span class="sub">검색어 유형 분류에 쓰입니다</span></h2></div><div class="card-body">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">
        <div><label class="hint"><b>자사 브랜드</b> — 표기 변형을 모두 넣어주세요</label>
          <textarea class="inp" style="width:100%;height:64px;font-family:var(--mono);font-size:12px" onchange="setBrands('own',this.value)">${esc(S.brands.own.join(', '))}</textarea></div>
        <div><label class="hint"><b>경쟁사 브랜드</b> — 자사보다 먼저 판정됩니다</label>
          <textarea class="inp" style="width:100%;height:64px;font-family:var(--mono);font-size:12px" onchange="setBrands('comp',this.value)">${esc(S.brands.comp.join(', '))}</textarea></div>
      </div>
      <div class="hint" style="margin-top:12px">
        콤마로 구분합니다. 공백·점·하이픈은 무시하고 비교하므로 <b>rejuall</b> 하나로
        <span style="font-family:var(--mono)">reju all · reju-all · dr. reju-all</span> 이 모두 잡힙니다.
        포함 여부로 판정하니 짧은 단어는 오분류를 부릅니다 — <b>reju</b> 를 넣으면 경쟁사 <b>rejuran</b> 까지 자사로 잡힙니다.
      </div>
      ${(()=>{const g=splitKind(D.st).gen||[]; if(!g.length)return '';
        const m=new Map(); for(const r of g)m.set(r.term,(m.get(r.term)||0)+r.cost);
        const top=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12);
        return `<div class="hint" style="margin-top:14px;padding:12px;background:var(--paper);border-radius:6px">
          <b>일반 키워드 지출 TOP</b> — 이 중 브랜드명이 보이면 위 목록에 추가하세요<br>
          <span style="font-family:var(--mono);font-size:11px;line-height:1.9">${top.map(([t,c])=>`${esc(String(t).slice(0,32))} <b>${money0(c)}</b>`).join(' · ')}</span></div>`;})()}
    </div></div>
    <div class="card"><div class="card-head"><h2>판정 기준 설정</h2></div><div class="card-body">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        <div><label class="hint"><b>기본 목표 ACOS (%)</b></label><input class="inp" type="number" style="width:100%" value="${st.targetAcos}" onchange="S.settings.targetAcos=parseFloat(this.value)||30;save()"></div>
        <div><label class="hint"><b>제외 후보: 최소 클릭</b> (구매 0)</label><input class="inp" type="number" style="width:100%" value="${st.negClicks}" onchange="S.settings.negClicks=parseFloat(this.value)||10;save()"></div>
        <div><label class="hint"><b>제외 후보: 최소 지출 ($)</b> (구매 0)</label><input class="inp" type="number" style="width:100%" value="${st.negSpend}" onchange="S.settings.negSpend=parseFloat(this.value)||10;save()"></div>
        <div><label class="hint"><b>수확 기준: 최소 구매</b></label><input class="inp" type="number" style="width:100%" value="${st.harvestOrders}" onchange="S.settings.harvestOrders=parseFloat(this.value)||3;save()"></div>
      </div>
      <div class="hint" style="margin-top:14px">
        <span class="chip neg">제외 후보</span> 구매 0 & (클릭≥${st.negClicks} 또는 지출≥$${st.negSpend}) ·
        <span class="chip harvest">수확·이관</span> 구매≥${st.harvestOrders} & ACOS≤목표 ·
        <span class="chip scale">스케일업</span> 구매≥2 & ACOS≤목표×0.8 ·
        <span class="chip warn">입찰 인하</span> ACOS>목표×1.3 — 포트폴리오별 목표는 포트폴리오 탭에서 설정
      </div>
    </div></div>`;
}
function setBrands(which,v){
  S.brands={...S.brands,[which]:v.split(',').map(s=>s.trim()).filter(Boolean)};
  clearKindCache(); save(); renderData();
  toast(`${which==='own'?'자사':'경쟁사'} 브랜드 ${S.brands[which].length}개 저장`);
}
function clearAll(){ if(!confirm('목표 ACOS·판정 기준·브랜드 키워드를 초기화할까요?'))return; localStorage.removeItem(LS_KEY); location.reload(); }
function reloadData(){ _cache.clear(); applySel(); toast('서버에서 다시 불러왔습니다'); }

/* ═══════════════ Exports ═══════════════ */
function dlCsv(name,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function exportNegatives(){
  const list=termData().filter(x=>x.v.k==='neg');
  if(!list.length){toast('제외 후보가 없습니다');return;}
  dlCsv('negative-candidates.csv',[['Search Term','Type','Campaigns','Ad Groups','Clicks','Spend','Suggested'],
    ...list.map(x=>[x.term,x.asin?'ASIN':'Keyword',x.campaigns.join(' | '),x.ags.join(' | '),x.a.clk,x.a.cost.toFixed(2),x.asin?'Negative Product':'Negative Exact'])]);
  toast(`제외 후보 ${list.length}개 내보내기 완료`);
}
function exportTerms(){
  dlCsv('search-terms.csv',[['Search Term','Type','Verdict','Impressions','Clicks','CTR%','Spend','CPC','Purchases','CVR%','Sales','ACOS%','DPV'],
    ...termData().map(x=>[x.term,x.asin?'ASIN':'Keyword',x.v.label,x.a.imp,x.a.clk,x.a.ctr?.toFixed(2)??'',x.a.cost.toFixed(2),x.a.cpc?.toFixed(2)??'',x.a.pur,x.a.cvr?.toFixed(2)??'',x.a.sales.toFixed(2),x.a.acos===Infinity?'INF':x.a.acos?.toFixed(2)??'',x.a.dpv])]);
}
function exportCampaigns(){
  const glist=[...groupBy(byPf(D.cp,cState.pf),r=>r.camp+'│'+r.prod).values()];
  dlCsv('campaigns.csv',[['Campaign','Portfolio','Ad Product','Impressions','Clicks','Spend','Purchases','Sales','ACOS%'],
    ...glist.map(rs=>{const a=agg(rs);return [rs[0].camp,rs[0].pf,rs[0].prod,a.imp,a.clk,a.cost.toFixed(2),a.pur,a.sales.toFixed(2),a.acos===Infinity?'INF':a.acos?.toFixed(2)??''];})]);
}
function exportTargets(){
  const rows=byPf(D.tg,gState.pf);
  dlCsv('targets.csv',[['Target','ASIN','Match','Campaign','Bid','Status','Impressions','Clicks','Spend','Purchases','Sales','ACOS%'],
    ...rows.map(r=>{const a=agg([r]);return [r.tgt,asinOf(r.tgt)||'',r.mt,r.camp,r.bid||'',r.status,a.imp,a.clk,a.cost.toFixed(2),a.pur,a.sales.toFixed(2),a.acos===Infinity?'INF':a.acos?.toFixed(2)??''];})]);
}

/* ═══════════════ Init ═══════════════ */
load();boot();

</script>
</body>
</html>
