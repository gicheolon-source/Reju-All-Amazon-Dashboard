<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr.Reju-All 글로벌 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f7faf9; --card:#ffffff; --line:#e4ece9; --line2:#d3e0dc;
  --ink:#10312b; --sub:#5d7a73; --mut:#93aaa4;
  --teal:#0f766e; --teal-d:#0b5d57; --mint:#ccfbf1; --mint-l:#f0fdf9;
  --red:#dc2626; --red-l:#fef2f2; --amber:#d97706; --amber-l:#fffbeb;
  --green:#059669; --green-l:#ecfdf5;
  --shadow:0 1px 3px rgba(16,49,43,.06),0 4px 14px rgba(16,49,43,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c8d8d3;border-radius:4px}

/* ── login ── */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#f0fdf9,#e6f5f1 60%,#d9efe9);z-index:1000;display:flex;align-items:center;justify-content:center}
#login .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:44px 40px;width:360px;box-shadow:var(--shadow);text-align:center}
#login h1{font-size:21px;letter-spacing:-.3px;margin-bottom:4px}
#login h1 span{color:var(--teal)}
#login p{color:var(--sub);font-size:13px;margin-bottom:24px}
#login input{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;font-size:14px;margin-bottom:12px;outline:none;font-family:inherit}
#login input:focus{border-color:var(--teal)}
#login button{width:100%;padding:12px;background:var(--teal);color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
#login button:hover{background:var(--teal-d)}
#loginErr{color:var(--red);font-size:12px;margin-top:10px;display:none}

/* ── layout ── */
#app{display:none}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:224px;background:#fff;border-right:1px solid var(--line);padding:24px 14px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:9px;padding:0 10px 22px;border-bottom:1px solid var(--line);margin-bottom:16px}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#14b8a6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.logo b{font-size:15px;letter-spacing:-.2px}
.logo small{display:block;color:var(--mut);font-size:10.5px;font-weight:500}
.nav-label{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.6px;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--sub);font-weight:500;margin-bottom:2px;font-size:13.5px}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{background:var(--mint-l);color:var(--teal-d)}
.nav-item.on{background:var(--mint);color:var(--teal-d);font-weight:700}
.main{margin-left:224px;padding:26px 30px 60px;max-width:1460px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.topbar h2{font-size:21px;letter-spacing:-.3px}
.topbar .meta{display:flex;gap:8px;align-items:center}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--sub);font-weight:600}
.chip b{color:var(--teal)}
.chip.demo{background:var(--amber-l);border-color:#fde8c8;color:var(--amber)}
.chip.live{background:var(--green-l);border-color:#c7ecd9;color:var(--green)}
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}

/* ── cards / grid ── */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.kpi .k-val{font-size:22px;font-weight:800;letter-spacing:-.4px}
.kpi .k-sub{font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:500}
.kpi .k-sub b{font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.card h3{font-size:14.5px;margin-bottom:14px;letter-spacing:-.2px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-size:11.5px;color:var(--mut);font-weight:500}
.ch-wrap{position:relative;height:270px}
.ch-wrap.sm{height:230px}

/* ── badges ── */
.bdg{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:999px;font-size:11px;font-weight:700}
.bdg.ok{background:var(--green-l);color:var(--green)}
.bdg.no{background:var(--red-l);color:var(--red)}
.bdg.wn{background:var(--amber-l);color:var(--amber)}
.bdg.nt{background:#f1f5f4;color:var(--mut)}

/* ── tables ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{background:var(--mint-l);color:var(--sub);font-size:11.5px;font-weight:700;padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th.l,td.l{text-align:left}
td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid #eef4f2;text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.sub td{background:#f4faf8;font-weight:700}
tr.tot td{background:var(--mint);font-weight:800;font-size:13px}
tr:hover:not(.sub):not(.tot) td{background:#fafdfc}
td .mut{color:var(--mut);font-size:11px}
.thgrp th{background:#e7f6f1;color:var(--teal-d);font-size:11px;text-align:center;border-right:1px solid var(--line)}

/* ── alerts ── */
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;margin-bottom:6px;font-size:12.5px;font-weight:600}
.alert-row.bad{background:var(--red-l);color:#b91c1c}
.alert-row.warn{background:var(--amber-l);color:#b45309}
.alert-row.good{background:var(--green-l);color:#047857}

/* ── settings ── */
.set-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.set-row label{width:130px;font-size:12.5px;color:var(--sub);font-weight:600}
.set-row input{flex:1;min-width:120px;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;font-family:inherit;outline:none}
.set-row input:focus{border-color:var(--teal)}
.src-st{font-size:11px;font-weight:700}
.note{background:var(--mint-l);border:1px solid #d6efe7;border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:14px}
.note b{color:var(--teal-d)}
.page{display:none}.page.on{display:block}
.mb{margin-bottom:14px}
</style>
</head>
<body>

<div id="login">
  <div class="box">

  <div class="nav-item" data-p="settings" onclick="nav('settings')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>데이터 연동</div>
</div>

<div class="main">
  <div class="topbar">
    <h2 id="pageTitle">개요</h2>
    <div class="meta">
      <span class="chip" id="chipDate">기준일 —</span>
      <span class="chip" id="chipSrc">—</span>
      <button class="btn" onclick="refreshData()">↻ 새로고침</button>

  <div id="pg-products" class="page"></div>
  <div id="pg-plan" class="page"></div>
  <div id="pg-settings" class="page"></div>
</div>
</div>

<script>
/* ═══════════════ CONFIG ═══════════════ */
const LS='rejuall_';
const PW='rejuall';
const PAGE_TITLES={overview:'개요',sales:'매출 현황',ads:'광고 현황 (퍼포먼스 마케팅)',products:'제품 현황',plan:'월별 계획 vs 실적',settings:'데이터 연동 · 설정'};

const DEF_CFG={
  rates:{'미국':1380,'캐나다':1000,'영국':1800,'호주':900,'중동(UAE)':375},
  cur:{'미국':'USD','캐나다':'CAD','영국':'GBP','호주':'AUD','중동(UAE)':'AED'},
  thr:{'전체':0.20,'아마존':0.15,'틱톡샵':0.25},  // 광고비율 상한 (합/불)
  roasMin:2,                                      // PM ROAS 하한
  owners:{'아마존|미국':'온기철','아마존|캐나다':'온기철','아마존|영국':'온기철','아마존|호주':'온기철','아마존|중동(UAE)':'온기철','틱톡샵|미국':'김세원','틱톡샵|영국':'왕지윤'}
};
// 월별 매출 계획 (만원) — xlsx 월별계획 시트 기본값
const DEF_PLAN={
  '아마존|미국':12000,'아마존|캐나다':800,'아마존|영국':1500,'아마존|호주':600,'아마존|중동(UAE)':400,
  '틱톡샵|미국':9000,'틱톡샵|영국':2500
};
const DEF_BUDGET={
  'Meta|미국':1200,'Meta|영국':400,'Google|미국':800,'Google|영국':250,'TikTok Ads|미국':1000,'TikTok Ads|영국':300
};
// 구글시트 소스 (gviz). status: 공유설정 공개 필요
const DEF_SRC=[
  {ch:'아마존',co:'미국',   id:'1tlz01J78avbCMn2zObK1gN5-Sy1oPwz_VthdalC49ao',gid:'1609839593'},
  {ch:'아마존',co:'캐나다', id:'1_IYvl05yI8YmHFYkMeicHPwBHIwGWUZgXLfrZ4txRio',gid:'1026315804'},
  {ch:'아마존',co:'영국',   id:'1dESw-mxQKkkN-NzvPd9eg4M3YkKPAjFZmP_PyddqgX8',gid:'1026315804'},
  {ch:'아마존',co:'호주',   id:'11rXNp-JU1WnqkxAcEsX9SO0JOpaNAbrU2zvgxGh0ZgQ',gid:'1026315804'},
  {ch:'아마존',co:'중동(UAE)',id:'1JGDCm4bmW5NsJffgwJD_uW2ZbkiCwbzzwWDOFMXyYos',gid:'1026315804'},
  {ch:'틱톡샵',co:'미국',   id:'1TCF9cQpSSlyKru0vaQzUZmAOXciwO8O_Zkr9fi8NfcI',gid:'1243654523'},
  {ch:'틱톡샵',co:'영국',   id:'11hAym_BnzWSQxkQFOi4xKuLARyN35Fp9ixu1JbvaQtg',gid:'1243654523'},
];
const CHANNELS=[['아마존',['미국','캐나다','영국','호주','중동(UAE)']],['틱톡샵',['미국','영국']]];
const PLATFORMS=[['Meta',['미국','영국']],['Google',['미국','영국']],['TikTok Ads',['미국','영국']]];
const PALETTE=['#0f766e','#14b8a6','#5eead4','#f59e0b','#fb923c','#94a3b8','#64748b'];

let CFG=load('cfg',DEF_CFG), PLAN=load('plan',DEF_PLAN), BUDGET=load('budget',DEF_BUDGET), SRC=load('src',DEF_SRC);
let DAILY=[],PERF=[],PRODUCTS=[],DATA_MODE='demo';
let charts={};

function load(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):JSON.parse(JSON.stringify(d))}catch(e){return JSON.parse(JSON.stringify(d))}}
function save(k,v){localStorage.setItem(LS+k,JSON.stringify(v))}

/* ═══════════════ DEMO DATA ═══════════════ */
// 시드 난수 — 리로드해도 동일한 데모 데이터
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TODAY=new Date(2026,9,5); // 데모 기준일 (실데이터 연동 시 시트 최신일로 대체)
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function genDemo(){
  DAILY=[];PERF=[];
  // 현지통화 일 베이스 (xlsx 일일입력 예시 기반)
  const base={'아마존|미국':{s:3200,a:480,o:95,as:1100,af:0},'아마존|캐나다':{s:260,a:40,o:9,as:90,af:0},
    '아마존|영국':{s:310,a:50,o:12,as:100,af:0},'아마존|호주':{s:220,a:30,o:7,as:70,af:0},
    '아마존|중동(UAE)':{s:400,a:60,o:8,as:130,af:0},'틱톡샵|미국':{s:2400,a:520,o:80,as:900,af:1500},'틱톡샵|영국':{s:520,a:120,o:22,as:180,af:330}};
  const pbase={'Meta|미국':{sp:350,im:42000,cl:900,cv:28,cs:1050},'Meta|영국':{sp:110,im:15000,cl:320,cv:9,cs:300},
    'Google|미국':{sp:240,im:18000,cl:700,cv:22,cs:900},'Google|영국':{sp:70,im:6000,cl:210,cv:6,cs:190},
    'TikTok Ads|미국':{sp:300,im:60000,cl:1100,cv:20,cs:700},'TikTok Ads|영국':{sp:90,im:20000,cl:380,cv:6,cs:190}};
  const start=new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1); // 전월 1일부터
  for(let d=new Date(start);d<=TODAY;d.setDate(d.getDate()+1)){
    const dow=d.getDay(), wk=(dow===0||dow===6)?1.18:1; // 주말 가중
    const seedD=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
    for(const[key,b]of Object.entries(base)){
      const[ch,co]=key.split('|');
      const r=mulberry(seedD+key.length*7919+ch.charCodeAt(0)*31+co.charCodeAt(0));
      const f=(0.78+r()*0.5)*wk, fa=0.85+r()*0.35;
      DAILY.push({d:iso(d),ch,co,sales:b.s*f,ad:b.a*f*fa,orders:Math.max(1,Math.round(b.o*f)),adSales:b.as*f*fa,aff:b.af*f});
    }
    for(const[key,b]of Object.entries(pbase)){
      const[pf,co]=key.split('|');
      const r=mulberry(seedD+pf.charCodeAt(0)*131+co.charCodeAt(0)*17);
      const f=0.8+r()*0.45;
      PERF.push({d:iso(d),pf,co,spend:b.sp*f,imp:Math.round(b.im*f),clk:Math.round(b.cl*f),conv:Math.max(1,Math.round(b.cv*f)),cvSales:b.cs*f*(0.85+r()*0.4)});
    }
  }
  // 제품 데모 (판매가=USD 현지, 원가=원)
  PRODUCTS=[

/* ═══════════════ 계산 유틸 ═══════════════ */
const rate=co=>CFG.rates[co]||1380;
const toMan=(v,co)=>v*rate(co)/10000; // 현지 → 만원
function fmtMan(v){ // 만원 → 표시
  if(v==null||isNaN(v))return '—';
  const neg=v<0?'-':'';v=Math.abs(v);
  if(v>=10000)return neg+(v/10000).toFixed(2)+'억';
  return neg+Math.round(v).toLocaleString()+'만';
}
const fmtN=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString();
const fmtPct=(v,d=1)=>v==null||isNaN(v)||!isFinite(v)?'—':(v*100).toFixed(d)+'%';
const fmtWon=v=>v==null||isNaN(v)?'—':'₩'+Math.round(v).toLocaleString();
function pctCls(v){return v>=0?'up':'dn'}
function arrow(v){return v==null||isNaN(v)?'':(v>=0?'▲ ':'▼ ')+Math.abs(v*100).toFixed(1)+'%'}

function dateCtx(){
  // 기준일 = 데이터 최신일
  let latest=TODAY;
  if(DAILY.length){const m=DAILY.reduce((a,r)=>r.d>a?r.d:a,'');latest=new Date(m+'T00:00:00')}
  const y=latest.getFullYear(),mo=latest.getMonth();
  const dim=new Date(y,mo+1,0).getDate(), elapsed=latest.getDate();
  const mtdPfx=`${y}-${String(mo+1).padStart(2,'0')}`;
  const pm=new Date(y,mo-1,1);
  const pmPfx=`${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,'0')}`;
  const pmDays=new Date(pm.getFullYear(),pm.getMonth()+1,0).getDate();
  const today=iso(latest);
  const yd=new Date(latest);yd.setDate(yd.getDate()-1);
  return{latest,y,mo,dim,elapsed,mtdPfx,pmPfx,pmDays,today,yesterday:iso(yd)};
}

// 채널·국가별 집계 (만원 환산)
function aggSales(ch,co){
  const c=dateCtx();
  const rows=DAILY.filter(r=>(ch==='*'||r.ch===ch)&&(co==='*'||r.co===co));
  const sum=(fil,fld,local)=>rows.filter(fil).reduce((a,r)=>a+(local?r[fld]:toMan(r[fld],r.co)),0);
  const mtd=r=>r.d.startsWith(c.mtdPfx), pmf=r=>r.d.startsWith(c.pmPfx);
  const o={
    today:sum(r=>r.d===c.today,'sales'), yesterday:sum(r=>r.d===c.yesterday,'sales'),
    todayLocal:rows.filter(r=>r.d===c.today).reduce((a,r)=>a+r.sales,0),
    mtd:sum(mtd,'sales'), mtdAd:sum(mtd,'ad'), mtdAdSales:sum(mtd,'adSales'), mtdAff:sum(mtd,'aff'),
    mtdOrders:rows.filter(mtd).reduce((a,r)=>a+r.orders,0),
    prev:sum(pmf,'sales'),
  };
  o.adRatio=o.mtd?o.mtdAd/o.mtd:null;
  o.est=c.elapsed?o.mtd/c.elapsed*c.dim:0;
  o.aov=o.mtdOrders?o.mtd*10000/o.mtdOrders:null; // 원
  o.prevAvg=o.prev/c.pmDays; o.mtdAvg=c.elapsed?o.mtd/c.elapsed:0;
  o.vsPrev=o.prevAvg?o.mtdAvg/o.prevAvg-1:null;
  return o;
}
function aggPerf(pf,co){
  const c=dateCtx();
  const rows=PERF.filter(r=>(pf==='*'||r.pf===pf)&&(co==='*'||r.co===co));
  const mtd=rows.filter(r=>r.d.startsWith(c.mtdPfx));
  const s=(arr,f,local)=>arr.reduce((a,r)=>a+(local?r[f]:toMan(r[f],r.co)),0);
  const o={
    todaySpend:s(rows.filter(r=>r.d===c.today),'spend'),
    todayLocal:rows.filter(r=>r.d===c.today).reduce((a,r)=>a+r.spend,0),
    spend:s(mtd,'spend'), cvSales:s(mtd,'cvSales'),
    imp:mtd.reduce((a,r)=>a+r.imp,0), clk:mtd.reduce((a,r)=>a+r.clk,0), conv:mtd.reduce((a,r)=>a+r.conv,0),
  };
  o.ctr=o.imp?o.clk/o.imp:null; o.cpc=o.clk?o.spend*10000/o.clk:null;
  o.cpa=o.conv?o.spend*10000/o.conv:null; o.roas=o.spend?o.cvSales/o.spend:null;
  o.est=c.elapsed?o.spend/c.elapsed*c.dim:0;
  return o;
}
const planOf=(ch,co)=>ch==='*'?Object.values(PLAN).reduce((a,b)=>a+b,0):co==='*'?Object.entries(PLAN).filter(([k])=>k.startsWith(ch+'|')).reduce((a,[,v])=>a+v,0):PLAN[ch+'|'+co]||0;
const budgetOf=(pf,co)=>pf==='*'?Object.values(BUDGET).reduce((a,b)=>a+b,0):co==='*'?Object.entries(BUDGET).filter(([k])=>k.startsWith(pf+'|')).reduce((a,[,v])=>a+v,0):BUDGET[pf+'|'+co]||0;
const thrOf=ch=>CFG.thr[ch]??CFG.thr['전체'];
function passBdg(ok,txtOk='합',txtNo='불'){return ok==null?'<span class="bdg nt">—</span>':ok?`<span class="bdg ok">${txtOk}</span>`:`<span class="bdg no">${txtNo}</span>`}

/* ═══════════════ 구글시트 연동 (gviz) ═══════════════ */
function gvizUrl(s){return `https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:json&gid=${s.gid}&headers=0`}
async function fetchGviz(s){
  const res=await fetch(gvizUrl(s));
  const txt=await res.text();
  if(!txt.includes('setResponse'))throw new Error('비공개 시트 (로그인 요구)');
  const json=JSON.parse(txt.substring(txt.indexOf('{'),txt.lastIndexOf('}')+1));
  if(json.status==='error')throw new Error(json.errors?.[0]?.detailed_message||'gviz error');
  // rows → 2D 배열 (Date(y,m,d) 파싱 포함)
  return json.table.rows.map(r=>(r.c||[]).map(c=>{
    if(!c)return null;
    if(typeof c.v==='string'&&c.v.startsWith('Date(')){
      const[y,m,d]=c.v.slice(5,-1).split(',').map(Number);
      return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
    return c.v;
  }));
}
async function testAll(){
  for(let i=0;i<SRC.length;i++){

    catch(e){SRC[i].ok=false;if(el)el.innerHTML='<span class="bdg no">접근불가</span>'}
  }

}
// 날짜 정규화: ISO 문자열 / 구글시트 serial number / "2026. 10. 5" / "10/5/2026" 모두 수용
function toISO(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&v>20000&&v<80000){ // Sheets serial (epoch 1899-12-30)
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    return d.toISOString().slice(0,10);
  }
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  let m=s.match(/^(\d{4})[.\/\-]\s*(\d{1,2})[.\/\-]\s*(\d{1,2})/); // 2026.10.5 / 2026. 10. 5
  if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);            // 10/5/2026
  if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return null;
}
// 시트 구조가 확정되면 이 매핑만 수정하면 됨:
// 기대 구조(행): [날짜, 매출(현지), 광고비(현지), 주문수, 광고매출(현지), 어필리에이트(현지)]
function parseSheetRows(rows,s){
  // 헤더 행 찾기: '날짜' 또는 'date' 포함 행
  let hi=rows.findIndex(r=>r.some(c=>typeof c==='string'&&/날짜|date/i.test(c)));
  const header=hi>=0?rows[hi].map(c=>String(c||'')):null;
  const body=rows.slice(hi+1);
  const col=pats=>header?header.findIndex(h=>pats.some(p=>h.replace(/\s/g,'').toLowerCase().includes(p))):-1;
  const ci={d:col(['날짜','date']),sales:col(['총매출','매출','sales','gmv','revenue']),ad:col(['광고비','spend','adspend']),
    orders:col(['주문','orders','units']),adSales:col(['광고매출','adsales','ppc']),aff:col(['어필리','affiliate','크리에이터'])};
  const out=[];
  body.forEach(r=>{
    const d=toISO(ci.d>=0?r[ci.d]:r[0]);
    if(!d)return;
    const num=i=>i>=0&&r[i]!=null&&r[i]!==''?+String(r[i]).replace(/[^0-9.\-]/g,'')||0:0;
    out.push({d,ch:s.ch,co:s.co,sales:num(ci.sales),ad:num(ci.ad),orders:num(ci.orders),adSales:num(ci.adSales),aff:num(ci.aff)});
  });
  return out;
}
/* Vercel 배포 시: 서비스 계정 프록시(/api/global/sheets)가 비공개 시트를 대신 읽어줌 */
async function loadViaApi(){
  const res=await fetch('/api/global/sheets');
  if(!res.ok)throw new Error('api '+res.status);
  const j=await res.json();
  if(!j.ok)throw new Error(j.error||'api error');
  const all=[],fails=[];
  j.sources.forEach(src=>{
    if(!src.ok){fails.push(`${src.ch} ${src.co}: ${src.error}${src.hint?' — '+src.hint:''}`);return}
    const s=SRC.find(x=>x.ch===src.ch&&x.co===src.co)||{ch:src.ch,co:src.co};
    const parsed=parseSheetRows(src.rows,s);
    if(!parsed.length)fails.push(`${src.ch} ${src.co}: 탭 '${src.title}'에서 날짜 데이터를 찾지 못함`);
    all.push(...parsed);
  });
  return{all,fails,saEmail:j.saEmail};
}
async function loadLive(){
  let all=[],fails=[],via='';
  // 1순위: 서비스 계정 프록시 (Vercel 배포에서만 존재 — 시트 비공개 유지 가능)
  try{const r=await loadViaApi();all=r.all;fails=r.fails;via='서비스 계정';}
  catch(e){
    // 2순위: gviz 직접 호출 (시트가 "링크 공개"일 때만 동작 — 로컬 프리뷰용)
    via='gviz(공개시트)';
    for(const s of SRC){
      try{const rows=await fetchGviz(s);const parsed=parseSheetRows(rows,s);
        if(!parsed.length)fails.push(`${s.ch} ${s.co}: 날짜 데이터를 찾지 못함`);
        all.push(...parsed);s.ok=true;
      }catch(e2){fails.push(`${s.ch} ${s.co}: ${e2.message}`);s.ok=false}
    }
    save('src',SRC);
  }
  if(all.length){DAILY=all;DATA_MODE='live';rerender();updateChips();}
  alert((all.length?`실데이터 ${all.length}행 로드 완료 (${via})\n`:'로드된 데이터 없음\n')+(fails.length?'\n실패:\n'+fails.join('\n'):''));
}
function refreshData(){if(DATA_MODE==='live')loadLive();else{genDemo();rerender()}}
