// COUNTRY_META 와 키가 1:1 이어야 한다 — loadG()/resetAll() 이 이걸로 국가를 만든다.
const DEFAULTS = {

let SYNC_MSG = SHARED ? '동기화 중…' : '로컬 모드';

function blankData(){
  const d = {};
  for(const c of Object.keys(COUNTRY_META)) d[c] = JSON.parse(JSON.stringify(DEFAULTS[c]));
  return d;
}
// 저장된 국가만 덮어쓴다. 그래서 (1) 새로 추가된 국가는 기본값을 얻고,
// (2) COUNTRY_META 에서 빠진 국가의 옛 데이터는 조용히 버려지고,
// (3) 마지막으로 보던 국가가 사라졌으면 US 로 돌아간다.
function loadG(){
  const g = { country:'US', data: blankData() };
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && saved.data){
        for(const c of Object.keys(COUNTRY_META)) if(saved.data[c]) g.data[c] = saved.data[c];
        if(COUNTRY_META[saved.country]) g.country = saved.country;
      }
    }
  }catch(e){}
  return g;
}
function setCountry(c){ G.country=c; S=G.data[c]; localStorage.setItem(LS_KEY, JSON.stringify(G)); render(); sheetLoad(); }

}

/* ---------- Google Sheet CSV loader ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(ch!=='\r') cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const num = v => { const n=Number(String(v||'').replace(/[",\s]/g,'')); return isNaN(n)?0:n; };

async function sheetLoad(){
  const cfg = SHEET[G.country];
  if(!cfg || !cfg.targets) return;
  try{
    const tRes = await fetch(cfg.targets);
    if(!tRes.ok) throw 0;
    const rows = parseCSV(await tRes.text());
    const hIdx = rows.findIndex(r=>String(r[0]||'').includes('제품명'));
    const prods=[]; let coverage=null;
    for(let i=hIdx+1;i<rows.length;i++){
      const r=rows[i], a=String(r[0]||'').trim(), asin=String(r[1]||'').trim();
      if(a.includes('확보')){ coverage = r.slice(2,11).map(v=>num(v)||1); continue; }
      if(!asin) continue;
      prods.push({ name:a, sku:asin, asin, targets:r.slice(2,11).map(num), s7:0, d30:0, fba:0, pl3:0 });
    }
    if(cfg.data){
      const dRes = await fetch(cfg.data);
      if(dRes.ok){
        const dm={};
        parseCSV(await dRes.text()).forEach(r=>{
          const asin=String(r[0]||'').trim();
          if(asin && asin.length>=10 && !asin.includes('ASIN')) dm[asin]={ s7:num(r[2]), d30:num(r[3]), fba:num(r[4]), pl3:num(r[6]) };
        });
        prods.forEach(p=>{ const d=dm[p.asin]; if(d) Object.assign(p, d); });
      }
    }
    if(prods.length){ S.products = prods; if(coverage) S.coverage = coverage; }
    localStorage.setItem(LS_KEY, JSON.stringify(G));
    SYNC_MSG = (SHARED?'공유':'로컬')+' · 시트 동기화 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ SYNC_MSG='⚠️ 시트 불러오기 실패 — 마지막 데이터 표시 중'; }
  render();
}

/* ================= calc (v4 logic) ================= */
const fmt = n => (n==null||isNaN(n))?'–':Math.round(n).toLocaleString('ko-KR');
const pct = x => isFinite(x)?Math.round(x*100)+'%':'–';
function today(){ return new Date(); }
function curIdx(){
  const d=today();
  const i = MONTHS.findIndex(mo=>mo.y===d.getFullYear()&&mo.m===d.getMonth()+1);
  return i;
}
function remFrac(){
  const d=today();
  const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return (dim - d.getDate() + 1)/dim;
}
const tgt = (p,i) => (i>=0 && i<MONTHS.length) ? (Number(p.targets[i])||0) : 0;
const cov = i => (i>=0 && i<MONTHS.length) ? (Number(S.coverage[i])||1) : 1;
// sum of targets from month index `start`, spanning `span` months (fractional ok)
function spanNeed(p, start, span){
  let need=0, s=span;
  for(let k=0;k<5 && s>0;k++){ need += tgt(p,start+k)*Math.min(1,s); s-=1; }
  return need;
}
function transit(sku,dest){
  return S.pipeline.filter(r=>r.sku===sku && r.dest===dest && r.status==='이동중')
                   .reduce((a,r)=>a+(Number(r.qty)||0),0);
}
function calcRow(p){
  const ci = curIdx();
  const cT = tgt(p,ci);
  const D  = Math.round(cT*remFrac());
  const nT = tgt(p,ci+1);
  const K  = cov(ci+1);
  const pace = cT>0 ? ((Number(p.s7)||0)/7)/(cT/30) : 0;
  const inF = transit(p.sku,'FBA'), in3 = transit(p.sku,'3PL');
  const fba = Number(p.fba)||0, pl3 = Number(p.pl3)||0;
  const fbaNeed = Math.round(D + spanNeed(p,ci+1,K));
  const fbaPct = fbaNeed>0 ? (fba+inF)/fbaNeed : 1;
  const three = Number(S.settings.threePL)||0;
  const refill = three===0 ? 0 : Math.max(0, Math.round(fbaNeed-(fba+inF)));
  const T = three===0 ? Math.max(K, Number(S.settings.seaLead)+Number(S.settings.buffer)) : K+three;
  const sysNeed = Math.round(D + spanNeed(p,ci+1,T));
  const totalHave = fba+inF+pl3+in3;
  const order = Math.max(0, Math.round(sysNeed-totalHave));
  const sysPct = sysNeed>0 ? totalHave/sysNeed : 1;
  return {cT,D,nT,K,pace,fba,inF,pl3,in3,fbaNeed,fbaPct,refill,sysNeed,order,sysPct};
}
function statusPill(x){
  if(x<0.6)  return '<span class="pill p-red">위험</span>';
  if(x<0.95) return '<span class="pill p-amber">주의</span>';
  return '<span class="pill p-green">양호</span>';
}
const pctClass = x => x<0.6?'cell-red':(x<0.95?'cell-amber':'cell-green');

/* 월별 계획: levels & shipments (indices 4=9월 .. 8=1월) */
function planLevels(p){ // L(m) for m=4..8
  const L={};
  for(let m=4;m<=8;m++) L[m]=Math.round(spanNeed(p,m,cov(m)));
  return L;
}
function planShip(p){ // ship(m) for m=3(8월)..7(12월); ship(3)=L(4) since L(3)=t(3)
  const L=planLevels(p), sh={};
  sh[3]=L[4];
  for(let m=4;m<=7;m++) sh[m]=Math.max(0, (m+1<=8?L[m+1]:0) + tgt(p,m) - L[m]);
  return sh;
}

  let h=`<div class="card"><div class="card-h"><h2>Pipeline 발송로그</h2><span class="hint">발송 1건 = 1행 · '이동중'만 Dashboard에 집계</span></div>
  <div class="formrow">
    <label>발송일<input type="date" id="npDate" value="${new Date().toISOString().slice(0,10)}"></label>
    <label>SKU<select id="npSku">${opts}</select></label>
    <label>수량<input type="number" id="npQty" min="1" style="width:100px"></label>
    <label>운송<select id="npMode"><option>해상</option><option>항공</option><option>트럭</option></select></label>
    <label>목적지<select id="npDest"><option>FBA</option><option value='3PL'>${COUNTRY_META[G.country].wh}(3PL)</option></select></label>
    <label>ETA<input type="date" id="npEta"></label>
    <label>메모<input type="text" id="npMemo" style="width:160px"></label>
    <button class="btn primary" onclick="addPipe()">발송 추가</button>
  </div>
  <div class="card-b twrap"><table><thead><tr>
  <th>발송일</th><th>SKU</th><th>수량</th><th>운송</th><th>목적지</th><th>ETA</th><th>상태</th><th>메모</th><th></th></tr></thead><tbody>`;
  if(!S.pipeline.length) h+=`<tr><td colspan="9" class="ctr" style="color:var(--sub);padding:20px">발송 기록이 없습니다. 위에서 첫 발송을 추가하세요.</td></tr>`;
  S.pipeline.forEach((r,i)=>{
    const st=r.status==='이동중'?'p-amber':(r.status==='입고완료'?'p-green':'p-gray');
    h+=`<tr><td class="ctr">${r.date}</td><td class="ctr">${r.sku}</td><td>${fmt(r.qty)}</td>
    <td class="ctr">${r.mode}</td><td class="ctr">${r.dest}</td><td class="ctr">${r.eta||'–'}</td>
    <td class="ctr"><select onchange="setPipe(${i},this.value)">
      <option ${r.status==='이동중'?'selected':''}>이동중</option>
      <option ${r.status==='입고완료'?'selected':''}>입고완료</option>
      <option ${r.status==='취소'?'selected':''}>취소</option></select></td>
    <td class="txt" style="font-size:12px;color:var(--sub)">${r.memo||''}</td>
    <td class="ctr"><button class="btn sm danger" onclick="delPipe(${i})">삭제</button></td></tr>`;
  });
  h+=`</tbody></table></div>
  <div class="note"><b>운영 규칙</b> · 입고 확인 → 상태를 '입고완료'로 변경 → Data 입력 탭의 해당 재고(FBA 또는 3PL)에 수량 반영. 이 순서를 지켜야 이중 계산이 없습니다.</div></div>`;
  return h;
}

function vPlan(){
  const three=Number(S.settings.threePL)||0;
  const mNames=['9/1','10/1','11/1','12/1',"1/1('27)"];
  let h=`<div class="card"><div class="card-h"><h2>① 월초 필요 FBA 재고 레벨</h2><span class="hint">각 월 1일 착지 목표 = 그 달부터 확보 개월수만큼의 목표 합</span></div><div class="card-b twrap"><table><thead><tr><th>제품명</th>`;
  mNames.forEach(n=>h+=`<th>${n} 필요</th>`); h+=`</tr></thead><tbody>`;
  S.products.forEach(p=>{
    const L=planLevels(p);
    h+=`<tr><td class="txt">${p.name}</td>`;
    for(let m=4;m<=8;m++) h+=`<td>${fmt(L[m])}</td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table></div></div>`;

  h+=`<div class="card"><div class="card-h"><h2>② 3PL → FBA 월중 출고량</h2><span class="hint">출고량 = 익월초 레벨 + 당월 소진 − 당월초 레벨</span></div><div class="card-b twrap"><table><thead><tr>
  <th>제품명</th><th>8월 출고</th><th>9월 출고</th><th>10월 출고 ⚠️최대</th><th>11월 출고</th><th>12월 출고</th></tr></thead><tbody>`;
  S.products.forEach(p=>{
    const sh=planShip(p);
    h+=`<tr><td class="txt">${p.name}</td>`;
    for(let m=3;m<=7;m++){
      const v=three===0?'–':fmt(sh[m]);
      h+=`<td class="${m===5?'cell-hl':''}">${v}</td>`;
    }
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>
  <div class="note"><b>출고 시점</b> · 8월분: 8/15~20 · 10월분(연중 최대): <b>11월분 10/8~12 + 12월분 10월 하순 분할 필수</b> (FC 입고 캐파) · 11월분: 11/20~25 ·
  ${three===0?'<b>현재 FBA 단일 모드 — 이 블록은 비활성입니다.</b>':'현 재고 차감 순수량은 Dashboard 참고 (여기는 총량 계획).'}</div></div>`;

  h+=`<div class="card"><div class="card-h"><h2>③ 한국 → 3PL 해상 선적 계획</h2><span class="hint">선적월 물량 = 도착월(+2개월)의 3PL→FBA 출고량</span></div><div class="card-b twrap"><table><thead><tr>
  <th>제품명</th><th>7월 선적<br>(9월 도착)</th><th>8월 선적 ★<br>(10월 도착)</th><th>9월 선적<br>(11월 도착)</th><th>10월 선적<br>(12월 도착)</th></tr></thead><tbody>`;
  S.products.forEach(p=>{
    const sh=planShip(p);
    h+=`<tr><td class="txt">${p.name}</td><td>${fmt(sh[4])}</td><td class="cell-hl"><b>${fmt(sh[5])}</b></td><td>${fmt(sh[6])}</td><td>${fmt(sh[7])}</td></tr>`;
  });
  h+=`</tbody></table></div>
  <div class="note"><b>★ 8월 선적이 핵심</b> — 10월 대량 출고(11+12월분)를 받칩니다. 늦으면 부분 항공 전환 검토.
  3PL 자체 보유분과 현 재고 부족분까지 반영한 순수량은 Dashboard '한국 발주 필요'를 쓰세요.
  ${three===0?'FBA 단일 모드에서는 도착지가 FBA 직행 — FC 체크인 2~4주를 감안해 선적을 2주 앞당기세요.':''}</div></div>`;
  return h;
}

function vSet(){
  const s=S.settings;
  const row=(lab,key,step,hint)=>`<tr><td class="txt">${lab}</td>
    <td><input type="number" min="0" step="${step}" value="${s[key]}" onchange="setS('${key}',this.value)"></td>
    <td class="txt" style="font-size:12px;color:var(--sub);white-space:normal">${hint}</td></tr>`;
  let h=`<div class="card"><div class="card-h"><h2>운영 파라미터</h2></div><div class="card-b twrap"><table>
  <thead><tr><th style="width:220px">항목</th><th style="width:120px">값</th><th>설명</th></tr></thead><tbody>
  ${row(`★ ${COUNTRY_META[G.country].wh} 보관 월수`,'threePL',0.5,'FBA 확보분 이후 3PL 추가 보유 개월수. <b>0 = 3PL 미운영</b> → FBA가 해상리드+버퍼를 직접 커버하는 단일 모드로 전체 자동 전환')}
  ${row('해상 리드타임 (개월)','seaLead',0.5,'한국 → 현지 해상 운송')}
  ${row('항공 리드타임 (개월)','airLead',0.5,'한국 → 현지 항공 운송')}
  ${row('3PL→FBA 리드타임 (주)','plToFbaWeeks',1,'3PL 출고 → FC 입고 완료. Q4 후반 3~4주로 지연 가능')}
  ${row('발주 버퍼 (개월)','buffer',0.5,'3PL 미운영 시 리드타임에 더하는 안전 여유')}
  <tr><td class="txt"><input type="text" value="${s.eventLabel||''}" onchange="setS('eventLabel',this.value)" style="width:80px"> 행사일</td><td><input type="date" value="${s.pbdd}" onchange="setS('pbdd',this.value)"></td><td class="txt" style="font-size:12px;color:var(--sub)">행사 이름·날짜 — 헤더 D-day 기준 (행사가 끝나면 다음 행사로 바꾸세요. 예: PBDD → BFCM)</td></tr>
  </tbody></table></div></div>`;

  if(sheetMode()){
    h+=`<div class="card"><div class="card-h"><h2>제품 관리 (구글 시트 연동)</h2><span class="hint">제품 추가·삭제는 시트 '월별 목표' 탭에서 — 행을 추가하면 자동 반영</span></div><div class="card-b twrap"><table><thead><tr><th>제품명</th><th>ASIN</th></tr></thead><tbody>`;
    S.products.forEach(p=>{ h+=`<tr><td class="txt">${p.name}</td><td class="ctr">${p.asin}</td></tr>`; });
    h+=`</tbody></table></div></div>`;
    return h;
  }
  h+=`<div class="card"><div class="card-h"><h2>제품 관리</h2><span class="hint">추가 시 월별 목표·Data 탭에 자동 반영</span></div>
  <div class="formrow">
    <label>제품명<input type="text" id="nprName" style="width:180px"></label>
    <label>SKU<input type="text" id="nprSku" style="width:120px"></label>
    <label>ASIN<input type="text" id="nprAsin" style="width:130px"></label>
    <button class="btn primary" onclick="addProd()">제품 추가</button>
  </div>
  <div class="card-b twrap"><table><thead><tr><th>제품명</th><th>SKU</th><th>ASIN</th><th></th></tr></thead><tbody>`;
  S.products.forEach((p,i)=>{
    h+=`<tr><td class="txt">${p.name}</td><td class="ctr">${p.sku}</td><td class="ctr">${p.asin}</td>
    <td class="ctr"><button class="btn sm danger" onclick="delProd(${i})">삭제</button></td></tr>`;
  });
  h+=`</tbody></table></div>
  <div class="note">제품 삭제는 해당 SKU의 목표·재고·발송 기록을 모두 지웁니다. 삭제 전 백업을 권장합니다.</div></div>`;
  return h;
}

/* ================= mutations ================= */
function setTgt__inner(pi,i,v){ S.products[pi].targets[i]=Number(v)||0; save(); render(); }
function setCov__inner(i,v){ S.coverage[i]=Number(v)||0; save(); render(); }
function setP__inner(pi,k,v){ S.products[pi][k]=Number(v)||0; save(); render(); }
function setS__inner(k,v){ S.settings[k]=(k==='pbdd'||k==='eventLabel')?v:(Number(v)||0); save(); render(); }
function addPipe__inner(){
  const g=id=>document.getElementById(id).value;
  const qty=Number(g('npQty'));
  if(!qty){ alert('수량을 입력하세요.'); return; }
  S.pipeline.unshift({date:g('npDate'),sku:g('npSku'),qty,mode:g('npMode'),dest:g('npDest'),eta:g('npEta'),status:'이동중',memo:g('npMemo')});
  save(); render();
}
function setPipe__inner(i,v){ S.pipeline[i].status=v; save(); render(); }
function delPipe__inner(i){ S.pipeline.splice(i,1); save(); render(); }
function addProd__inner(){
  const name=document.getElementById('nprName').value.trim();
  const sku=document.getElementById('nprSku').value.trim();
  const asin=document.getElementById('nprAsin').value.trim();
  if(!name||!sku){ alert('제품명과 SKU를 입력하세요.'); return; }
  S.products.push({name,sku,asin,targets:MONTHS.map(()=>0),s7:0,fba:0,pl3:0});
  save(); render();
}
function delProd__inner(i){
  if(!confirm(`'${S.products[i].name}' 제품과 관련 기록을 모두 삭제할까요?`)) return;
  const sku=S.products[i].sku;
  S.pipeline=S.pipeline.filter(r=>r.sku!==sku);
  S.products.splice(i,1);
  save(); render();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(G,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='inventory_all_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{ const d=JSON.parse(e.target.result);
      if(d.data && d.data.US){ G=d; S=G.data[G.country]; }
      else if(d.products && d.settings){ G.data[G.country]=d; S=G.data[G.country]; }
      else throw 0;
      save(); render(); alert('복원 완료.');
    }catch(err){ alert('파일 형식이 올바르지 않습니다.'); }
  };
  r.readAsText(f); inp.value='';
}
function resetAll(){
  if(!guard()) return;
  if(!confirm(G.country+' 데이터를 초기값으로 되돌릴까요? 되돌릴 수 없습니다.')) return;
  G.data[G.country]=JSON.parse(JSON.stringify(DEFAULTS[G.country]));
  S=G.data[G.country]; save(); render();
}

function setTgt(...a){ if(!guard()) return; setTgt__inner(...a); }
function setCov(...a){ if(!guard()) return; setCov__inner(...a); }
function setP(...a){ if(!guard()) return; setP__inner(...a); }
function setS(...a){ if(!guard()) return; setS__inner(...a); }
function addPipe(...a){ if(!guard()) return; addPipe__inner(...a); }
function setPipe(...a){ if(!guard()) return; setPipe__inner(...a); }
function delPipe(...a){ if(!guard()) return; delPipe__inner(...a); }
function addProd(...a){ if(!guard()) return; addProd__inner(...a); }
function delProd(...a){ if(!guard()) return; delProd__inner(...a); }

/* ================= render ================= */
function render(){
  renderHeader(); renderNav();
  const v={dash:vDash,tgt:vTgt,data:vData,pipe:vPipe,plan:vPlan,set:vSet}[cur];
  document.getElementById('main').innerHTML='<div class="view">'+v()+'</div>';
}
render();
// 순서가 중요하다. sbLoad() 는 G.data[국가] 를 통째로 갈아끼우므로,
// 둘을 병렬로 띄우면 늦게 끝난 쪽이 이긴다 — Supabase 에 저장된 오래된 제품·목표가
// 방금 시트에서 읽은 값을 덮어쓸 수 있다. 시트가 진실이므로 항상 나중에 실행한다.
sbLoad().then(sheetLoad);
</script>
</body>
</html>
