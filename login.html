<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMZ Ads Lab — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:#171C26;color:#EDEBE4;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:340px}
.brand{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.brand i{color:#E8850C;font-style:normal}
.sub{font-size:11px;color:#8A867C;font-family:'IBM Plex Mono',monospace;margin-bottom:26px}
label{display:block;font-size:12px;color:#8A867C;margin-bottom:6px}
input{width:100%;padding:11px 12px;font-size:14px;border-radius:6px;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#EDEBE4}
input:focus{outline:none;border-color:#E8850C}
button{width:100%;margin-top:12px;padding:11px;font-size:14px;font-weight:600;border:0;border-radius:6px;
       background:#E8850C;color:#171C26;font-family:inherit}
button:disabled{opacity:.5}
.err{margin-top:12px;font-size:12px;color:#E8850C;min-height:16px}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="brand">AMZ<i>·</i>ADS LAB</div>
  <div class="sub">Dr Rejuall Brand</div>
  <label for="pw">비밀번호</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus required>
  <button type="submit" id="go">들어가기</button>
  <div class="err" id="err"></div>
</form>
<script>
const f=document.getElementById('f'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), err=document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault();
  go.disabled=true; err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
                                     body:JSON.stringify({password:pw.value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ location.replace(new URLSearchParams(location.search).get('next')||'/'); return; }
    err.textContent=j.error||'로그인에 실패했습니다';
  }catch(_){ err.textContent='서버에 연결할 수 없습니다'; }
  go.disabled=false; pw.select();
});
</script>
</body>
</html>
